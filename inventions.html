<script type="application/ld+json" id="ld-content">{"@context":"https://schema.org","@graph":[{"@type":"ItemList","name":"Inventions and science","url":"https://brazilianculture.biblioverse.org/inventions.html","numberOfItems":23,"itemListElement":[{"@type":"ListItem","position":1,"item":{"@type":"Thing","name":"The hammock","description":"(Indigenous peoples · centuries) Europeans saw hammocks as soon as they arrived and Pero Vaz de Caminha mentions them. They’re still a fixture from the North to the Northeast."}},{"@type":"ListItem","position":2,"item":{"@type":"Thing","name":"Manioc flour","description":"(Indigenous peoples · millennia) Indigenous peoples domesticated manioc and developed ways to remove the poison from bitter varieties, a technique later taken to Africa."}},{"@type":"ListItem","position":3,"item":{"@type":"Thing","name":"Terra preta","description":"(Indigenous peoples · millennia) Dark, fertile soil created by Amazonian peoples that still intrigues scientists. The forest is also, in part, a human creation."}},{"@type":"ListItem","position":4,"item":{"@type":"Thing","name":"The Passarola","description":"(Inventions · 1709) Father Bartolomeu de Gusmão, born in Santos, flew a small hot-air balloon before the Portuguese court."}},{"@type":"ListItem","position":5,"item":{"@type":"Thing","name":"The typewriter","description":"(Inventions · 1861) Father Francisco João de Azevedo, from Paraíba, showed a typing machine before the American commercial models."}},{"@type":"ListItem","position":6,"item":{"@type":"Thing","name":"Voice radio","description":"(Inventions · 1900) Father Roberto Landell de Moura, from southern Brazil, made wireless voice transmissions and took out patents in Brazil and the US."}},{"@type":"ListItem","position":7,"item":{"@type":"Thing","name":"Antivenom serum","description":"(Science · 1901) Vital Brazil discovered that each type of snake requires a specific serum and founded the Butantan Institute, one of the world’s largest vaccine centres."}},{"@type":"ListItem","position":8,"item":{"@type":"Thing","name":"Sanitation and epidemic campaigns","description":"(Science · 1903) Oswaldo Cruz wiped out yellow fever in Rio, but compulsory smallpox vaccination sparked the Vaccine Revolt of 1904."}},{"@type":"ListItem","position":9,"item":{"@type":"Thing","name":"14-Bis","description":"(Inventions · 1906) Alberto Santos-Dumont flew in Paris in the first public take-off of an aeroplane without a catapult. For Brazilians, he, not the Wright brothers, is the father of aviation. He also popularised the wristwatch."}},{"@type":"ListItem","position":10,"item":{"@type":"Thing","name":"Chagas disease","description":"(Science · 1909) Carlos Chagas single-handedly described the parasite, the vector and the disease, a feat unique in the history of medicine."}},{"@type":"ListItem","position":11,"item":{"@type":"Thing","name":"The pion","description":"(Science · 1947) César Lattes helped detect this subatomic particle. The Nobel went only to his boss, Cecil Powell. Brazil’s national academic CV platform bears Lattes’s name."}},{"@type":"ListItem","position":12,"item":{"@type":"Thing","name":"Bradykinin","description":"(Science · 1948) Maurício Rocha e Silva discovered it using jararaca venom. Later research led to captopril, one of the most widely used blood pressure drugs."}},{"@type":"ListItem","position":13,"item":{"@type":"Thing","name":"The Economic Growth of Brazil","description":"(Science · 1959) Celso Furtado explained Brazilian underdevelopment in a classic of world economics and created the regional development agency Sudene."}},{"@type":"ListItem","position":14,"item":{"@type":"Thing","name":"Biological nitrogen fixation","description":"(Science · 1960) Johanna Döbereiner showed that bacteria can replace fertiliser on soybeans. It saves billions a year and underpins much of Brazilian agriculture’s strength."}},{"@type":"ListItem","position":15,"item":{"@type":"Thing","name":"The Orelhão","description":"(Inventions · 1971) The “Big Ear” phone booth by architect Chu Ming Silveira. Cheap, tough and easy to spot, it became part of the landscape and was exported to other countries."}},{"@type":"ListItem","position":16,"item":{"@type":"Thing","name":"The Stereobelt (the walkman’s grandfather)","description":"(Inventions · 1972) German-Brazilian Andreas Pavel created a portable cassette player in São Paulo. Years later, Sony reached a settlement over the patent."}},{"@type":"ListItem","position":17,"item":{"@type":"Thing","name":"Ethanol and Proálcool","description":"(Inventions · 1975) After the oil crisis, Brazil bet on sugarcane alcohol as fuel. That led to the flex-fuel car (2003), now most of the national fleet."}},{"@type":"ListItem","position":18,"item":{"@type":"Thing","name":"Farming the Cerrado","description":"(Science · 1973) Embrapa adapted acidic soils and crops to the Cerrado savanna, making Brazil an agricultural power, at a high environmental cost."}},{"@type":"ListItem","position":19,"item":{"@type":"Thing","name":"A geography of the Amazon","description":"(Science · 1990) Bertha Becker showed the forest is also urban and political and influenced sustainable development plans for the region."}},{"@type":"ListItem","position":20,"item":{"@type":"Thing","name":"The electronic ballot box","description":"(Inventions · 1996) General elections have been 100% electronic since 2000, with results within hours, even with 158 million voters."}},{"@type":"ListItem","position":21,"item":{"@type":"Thing","name":"A Fields Medal","description":"(Science · 2014) Artur Avila, from Rio and trained at IMPA, won the “Nobel of mathematics”, the first for Latin America."}},{"@type":"ListItem","position":22,"item":{"@type":"Thing","name":"Pix","description":"(Inventions · 2020) The Central Bank’s free instant payment system. It’s now a case study around the world: even the popcorn seller takes it."}},{"@type":"ListItem","position":23,"item":{"@type":"Thing","name":"Sequencing the coronavirus","description":"(Science · 2020) Jaqueline Goes de Jesus and Ester Sabino sequenced the virus 48 hours after the country’s first case."}}]}]}</script>
