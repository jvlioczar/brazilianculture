<script type="application/ld+json" id="ld-content">{"@context":"https://schema.org","@graph":[{"@type":"ItemList","name":"On the everyday plate","url":"https://brazilianculture.biblioverse.org/food.html","numberOfItems":6,"itemListElement":[{"@type":"ListItem","position":1,"item":{"@type":"Thing","name":"Rice and beans","description":"The most common pair at the table, usually with salad, a meat and farofa."}},{"@type":"ListItem","position":2,"item":{"@type":"Thing","name":"Breakfast","description":"A fresh bread roll with butter, milky coffee and fruit. The bread comes from the bakery on the corner."}},{"@type":"ListItem","position":3,"item":{"@type":"Thing","name":"Prato feito","description":"The “PF” or the per-kilo restaurant: a cheap lunch where you either pay by weight or get a full plate."}},{"@type":"ListItem","position":4,"item":{"@type":"Thing","name":"Bakery snacks","description":"A coxinha, esfiha or empada with a soft drink sorts out lunch anywhere in the country."}},{"@type":"ListItem","position":5,"item":{"@type":"Thing","name":"Fruit","description":"Bananas, mangoes, papayas and oranges are cheap all year round."}},{"@type":"ListItem","position":6,"item":{"@type":"Thing","name":"Sunday lunch","description":"The family around the table with pasta, roast chicken or churrasco."}}]},{"@type":"ItemList","name":"Dishes, snacks, sweets and drinks","url":"https://brazilianculture.biblioverse.org/food.html","numberOfItems":29,"itemListElement":[{"@type":"ListItem","position":1,"item":{"@type":"Thing","name":"Feijoada","description":"(Dishes) Black beans stewed with cuts of pork, served with rice, collard greens, farofa and orange. The classic Saturday lunch."}},{"@type":"ListItem","position":2,"item":{"@type":"Thing","name":"Moqueca","description":"(Dishes) Fish stewed in a clay pot. The Bahian version uses palm oil and coconut milk; the one from Espírito Santo uses annatto. People will argue over this."}},{"@type":"ListItem","position":3,"item":{"@type":"Thing","name":"Churrasco","description":"(Dishes) Born on the southern pampas, it became the Sunday ritual. The king of cuts is picanha, ideally with nothing but coarse salt."}},{"@type":"ListItem","position":4,"item":{"@type":"Thing","name":"Acarajé","description":"(Dishes) A black-eyed pea fritter fried in palm oil and filled with vatapá and prawns. An Afro-Brazilian sacred food sold by the baianas, who are recognised as national heritage."}},{"@type":"ListItem","position":5,"item":{"@type":"Thing","name":"Baião de dois","description":"(Dishes) Rice and beans cooked together with coalho cheese and sun-dried beef: the backlands on one plate."}},{"@type":"ListItem","position":6,"item":{"@type":"Thing","name":"Tacacá and real açaí","description":"(Dishes) Hot tucupi broth with jambu, the herb that makes your mouth tingle. In Pará, açaí is savoury and eaten with fish and manioc flour, a long way from the gym bowl."}},{"@type":"ListItem","position":7,"item":{"@type":"Thing","name":"Rice and beans","description":"(Dishes) The base of the national plate. For many people, it isn’t lunch without them."}},{"@type":"ListItem","position":8,"item":{"@type":"Thing","name":"Pão de queijo","description":"(Savoury snacks) Cheese bread from Minas Gerais, naturally gluten-free, made with manioc starch and cheese. Good with coffee at any hour."}},{"@type":"ListItem","position":9,"item":{"@type":"Thing","name":"Coxinha","description":"(Savoury snacks) Dough shaped like a chicken thigh, filled with shredded chicken and deep-fried. The queen of snack bars and birthday parties."}},{"@type":"ListItem","position":10,"item":{"@type":"Thing","name":"Street market pastel","description":"(Savoury snacks) Thin dough fried to order and served with sugarcane juice. A legacy of Japanese and Chinese immigrants in São Paulo."}},{"@type":"ListItem","position":11,"item":{"@type":"Thing","name":"Brigadeiro","description":"(Sweets) Chocolate, condensed milk and sprinkles. It appeared in the 1940s, tied to the campaign of Brigadier Eduardo Gomes, and no party goes without it."}},{"@type":"ListItem","position":12,"item":{"@type":"Thing","name":"Beijinho and cajuzinho","description":"(Sweets) The brigadeiro’s partners on the party table: one made with coconut and a clove, the other with peanuts."}},{"@type":"ListItem","position":13,"item":{"@type":"Thing","name":"Romeu e Julieta","description":"(Sweets) Guava paste with Minas cheese. The perfect match: sweet and salty on the same fork."}},{"@type":"ListItem","position":14,"item":{"@type":"Thing","name":"Quindim","description":"(Sweets) Egg yolk, sugar and coconut, a fusion of Portuguese convent sweets with ingredients from Africa and Brazil."}},{"@type":"ListItem","position":15,"item":{"@type":"Thing","name":"Paçoca","description":"(Sweets) Ground peanuts with sugar. Before it was a sweet, the Tupi word meant a mix of meat and flour."}},{"@type":"ListItem","position":16,"item":{"@type":"Thing","name":"Condensed milk pudding","description":"(Sweets) With caramel sauce, it’s the Sunday lunch dessert in homes everywhere."}},{"@type":"ListItem","position":17,"item":{"@type":"Thing","name":"Manioc and its flour","description":"(Ingredients) The staple of Indigenous peoples. It comes boiled, fried, as tapioca, starch, tucupi and farofa, which Brazilians put on almost everything."}},{"@type":"ListItem","position":18,"item":{"@type":"Thing","name":"Tapioca","description":"(Ingredients) Manioc starch cooked in a pan and filled with anything. Indigenous technology that’s now fashionable all over the country."}},{"@type":"ListItem","position":19,"item":{"@type":"Thing","name":"Dendê","description":"(Ingredients) The orange palm oil from Africa that gives Bahian cooking its colour and flavour."}},{"@type":"ListItem","position":20,"item":{"@type":"Thing","name":"Native fruit","description":"(Ingredients) Cupuaçu, jabuticaba, cashew fruit, pitanga, cajá, soursop, açaí. Many of them don’t even have an English name."}},{"@type":"ListItem","position":21,"item":{"@type":"Thing","name":"Cafézinho","description":"(Drinks) Strong, small and sweet. Brazil has been the world’s largest coffee producer for over 150 years and offering a cup is the basic gesture of hospitality."}},{"@type":"ListItem","position":22,"item":{"@type":"Thing","name":"Caipirinha","description":"(Drinks) Cachaça, lime, sugar and ice. National heritage and the world’s most famous Brazilian cocktail."}},{"@type":"ListItem","position":23,"item":{"@type":"Thing","name":"Cachaça","description":"(Drinks) A sugarcane spirit with its own protected name, thousands of brands and just as many nicknames."}},{"@type":"ListItem","position":24,"item":{"@type":"Thing","name":"Chimarrão","description":"(Drinks) Yerba mate in a gourd, with a metal straw and hot water, inherited from the Guarani. In Porto Alegre, people carry it down the street."}},{"@type":"ListItem","position":25,"item":{"@type":"Thing","name":"Tereré","description":"(Drinks) Chimarrão’s iced sibling, common in Mato Grosso do Sul."}},{"@type":"ListItem","position":26,"item":{"@type":"Thing","name":"Sugarcane juice","description":"(Drinks) Pressed to order, with lime or pineapple, the obligatory partner of a pastel."}},{"@type":"ListItem","position":27,"item":{"@type":"Thing","name":"Guaraná","description":"(Drinks) An Amazon fruit used by the Sateré-Mawé people and full of caffeine. It became a soft drink and an energy powder."}},{"@type":"ListItem","position":28,"item":{"@type":"Thing","name":"Vinagrete","description":"(Ingredients) Finely chopped tomato, onion, capsicum, vinegar and olive oil. Without it, a churrasco and farofa feel incomplete."}},{"@type":"ListItem","position":29,"item":{"@type":"Thing","name":"Pequi","description":"(Ingredients) The fruit of the Cerrado, with a very strong smell and flavour, as in rice with pequi from Goiás. Careful: it has spines inside, so you never bite it."}}]}]}</script>
