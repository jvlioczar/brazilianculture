<script type="application/ld+json" id="ld-content">{"@context":"https://schema.org","@graph":[{"@type":"ItemList","name":"Records and rankings","url":"https://brazilianculture.biblioverse.org/records.html","numberOfItems":17,"itemListElement":[{"@type":"ListItem","position":1,"item":{"@type":"Thing","name":"Most World Cups","description":"(Sport · 5 titles) The only five-time champion (1958, 1962, 1970, 1994 and 2002) and the only country to play in every edition."}},{"@type":"ListItem","position":2,"item":{"@type":"Thing","name":"The largest rainforest","description":"(Nature · 5.5m km²) About 60% of the Amazon is in Brazil. It’s the largest tropical rainforest in the world and home to around one in ten known species."}},{"@type":"ListItem","position":3,"item":{"@type":"Thing","name":"The largest river by volume","description":"(Nature · 1st) The Amazon pours more water into the ocean than the next seven rivers combined."}},{"@type":"ListItem","position":4,"item":{"@type":"Thing","name":"The largest tropical wetland","description":"(Nature · 150,000 km²) The Pantanal is the largest continuous tropical wetland on the planet, mostly in Brazil."}},{"@type":"ListItem","position":5,"item":{"@type":"Thing","name":"The greatest biodiversity","description":"(Nature · 1st) Brazil has the world’s greatest biological diversity, with around 20% of the planet’s species across six biomes."}},{"@type":"ListItem","position":6,"item":{"@type":"Thing","name":"Largest coffee producer","description":"(Economy · 1st) Since the 19th century, around a third of the world’s coffee has come from Brazil, which also leads in orange juice and soybeans."}},{"@type":"ListItem","position":7,"item":{"@type":"Thing","name":"Itaipu","description":"(Engineering · 14 GW) Shared with Paraguay, this is the hydroelectric dam with the highest total output in history and it was the world’s largest until China’s Three Gorges."}},{"@type":"ListItem","position":8,"item":{"@type":"Thing","name":"The largest Carnival bloc","description":"(Culture · 2m+) Recife’s Galo da Madrugada entered the Guinness World Records in 1995 and regularly draws over 2 million people on Carnival Saturday."}},{"@type":"ListItem","position":9,"item":{"@type":"Thing","name":"The biggest football crowd","description":"(Sport · 199,000) The estimated attendance at the 1950 World Cup defeat to Uruguay in the Maracanã, the “Maracanazo”. No World Cup match has seen so many people since."}},{"@type":"ListItem","position":10,"item":{"@type":"Thing","name":"The Lençóis Maranhenses","description":"(Nature · 1,550 km²) White dunes with rainwater lagoons, a rare phenomenon. A UNESCO World Heritage natural site since 2024."}},{"@type":"ListItem","position":11,"item":{"@type":"Thing","name":"The largest Japanese community","description":"(People · 2 million) Brazil has the largest population of Japanese descent outside Japan, ever since the ship Kasato Maru in 1908."}},{"@type":"ListItem","position":12,"item":{"@type":"Thing","name":"The largest destination of the slave trade","description":"(People · 5 million) Almost 5 million Africans were brought by force, around 40% of the whole Atlantic trade. It was the last country in the Americas to abolish slavery."}},{"@type":"ListItem","position":13,"item":{"@type":"Thing","name":"The world’s largest cashew tree","description":"(Nature · 8,500 m²) In Pirangi do Norte, Rio Grande do Norte, a mutation made the branches take root, forming a giant canopy from a single tree."}},{"@type":"ListItem","position":14,"item":{"@type":"Thing","name":"One of the most unequal countries","description":"(Economy · Top 10) No disguising it: Brazil is always among the most unequal countries in the world, with income highly concentrated at the top."}},{"@type":"ListItem","position":15,"item":{"@type":"Thing","name":"The largest Lebanese community","description":"(People · 3 to 10m) It’s often cited as the largest outside Lebanon, perhaps bigger than the population of Lebanon itself. But there’s no official count: estimates range from 3 to 10 million descendants."}},{"@type":"ListItem","position":16,"item":{"@type":"Thing","name":"South America’s largest economy","description":"(Economy · 1st) Brazil has the continent’s biggest GDP, but it isn’t the richest per person: on that measure it’s behind Guyana, Uruguay and Chile."}},{"@type":"ListItem","position":17,"item":{"@type":"Thing","name":"São Paulo against the world’s biggest cities","description":"(People · 21m) Greater São Paulo has around 21 million people and is among the world’s largest, but far from the top: according to the UN in 2025, the most populous city is Jakarta, with about 42 million, twice as many."}}]}]}</script>
