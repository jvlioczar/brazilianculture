<script type="application/ld+json" id="ld-content">{"@context":"https://schema.org","@graph":[{"@type":"ItemList","name":"Key dates","url":"https://brazilianculture.biblioverse.org/key-dates.html","numberOfItems":17,"itemListElement":[{"@type":"ListItem","position":1,"item":{"@type":"Thing","name":"New Year’s","description":"(Holidays · 1 January) Everyone in white on the beach, jumping seven waves, eating lentils and watching the fireworks at Copacabana. Many take flowers to Iemanjá."}},{"@type":"ListItem","position":2,"item":{"@type":"Thing","name":"Iemanjá Day","description":"(Traditions · 2 February) In Salvador, thousands take gifts to the sea at Rio Vermelho to honour Candomblé’s queen of the waters."}},{"@type":"ListItem","position":3,"item":{"@type":"Thing","name":"Carnival","description":"(Festivals · February or March) The biggest (unofficial) holiday of the year. The country stops for the parades, street blocos and sound trucks. Things only get serious after Ash Wednesday. Another view: Born in Rio’s Black communities, samba was repressed by police in the early 20th century before it became a national symbol."}},{"@type":"ListItem","position":4,"item":{"@type":"Thing","name":"Indigenous Peoples’ Day","description":"(Traditions · 19 April) Formerly “Indian Day”, it was renamed in 2022 with a more respectful term. Schools teach about it and many still paint children’s faces. Another view: Indigenous leaders often reject school costumes and use the date for the Free Land Camp in Brasília, demanding land demarcation."}},{"@type":"ListItem","position":5,"item":{"@type":"Thing","name":"Good Friday and Easter","description":"(Holidays · March or April) Salt cod on Friday and giant chocolate eggs hanging in supermarkets."}},{"@type":"ListItem","position":6,"item":{"@type":"Thing","name":"Tiradentes Day","description":"(Holidays · 21 April) Marks the hanging in 1792 of Joaquim José da Silva Xavier, leader of the Minas Conspiracy. Almost a national martyr, painted with a beard and long hair."}},{"@type":"ListItem","position":7,"item":{"@type":"Thing","name":"Discovery of Brazil","description":"(Traditions · 22 April) The date Cabral’s fleet arrived in 1500. It isn’t a holiday and passes almost unnoticed. Another view: For Indigenous peoples there was no “discovery”, but an invasion. At the 500th anniversary in 2000, an Indigenous march was repressed by police in Porto Seguro."}},{"@type":"ListItem","position":8,"item":{"@type":"Thing","name":"Labour Day","description":"(Holidays · 1 May) A day of union rallies, free concerts and minimum wage announcements."}},{"@type":"ListItem","position":9,"item":{"@type":"Thing","name":"Abolition of Slavery","description":"(Traditions · 13 May) In 1888, Princess Isabel signed the Golden Law. It isn’t a national holiday. Another view: The Black movement points out that the law gave no land, schooling or compensation, and prefers to celebrate 20 November."}},{"@type":"ListItem","position":10,"item":{"@type":"Thing","name":"June Festivals","description":"(Festivals · June) Square dancing, bonfires, corn, pamonha and mulled quentão, for Saints Anthony, John and Peter. In Campina Grande and Caruaru, it’s as big as Carnival."}},{"@type":"ListItem","position":11,"item":{"@type":"Thing","name":"Independence Day","description":"(Holidays · 7 September) In 1822, on the banks of the Ipiranga, Dom Pedro I declared “Independence or death!”. Today there are military parades and, recently, political rallies."}},{"@type":"ListItem","position":12,"item":{"@type":"Thing","name":"Our Lady of Aparecida and Children’s Day","description":"(Holidays · 12 October) The patron saint’s day, with millions of pilgrims at Aparecida, São Paulo state. The same date is toy day for children."}},{"@type":"ListItem","position":13,"item":{"@type":"Thing","name":"Círio de Nazaré","description":"(Festivals · 2nd Sunday of October) In Belém, over 2 million people follow the image of Our Lady, pulling an enormous rope. Families even hold a meal like Christmas lunch."}},{"@type":"ListItem","position":14,"item":{"@type":"Thing","name":"All Souls’ Day","description":"(Holidays · 2 November) A day to take flowers to the cemetery and remember those who’ve gone."}},{"@type":"ListItem","position":15,"item":{"@type":"Thing","name":"Proclamation of the Republic","description":"(Holidays · 15 November) In 1889, Marshal Deodoro overthrew the monarchy in a military coup. People watched, the accounts say, “bewildered”."}},{"@type":"ListItem","position":16,"item":{"@type":"Thing","name":"Black Awareness Day","description":"(Holidays · 20 November) A national holiday since 2024, on the anniversary of the death of Zumbi dos Palmares in 1695. It celebrates Afro-Brazilian struggle and culture. Another view: For the Black movement it was a victory: it began in 1971, in southern Brazil, with the Palmares group, as an alternative to 13 May."}},{"@type":"ListItem","position":17,"item":{"@type":"Thing","name":"Christmas","description":"(Holidays · 25 December) Dinner is on the night of the 24th, with turkey, French toast and dried fruit, in high summer. A family Secret Santa is compulsory."}}]}]}</script>
