<script type="application/ld+json" id="ld-content">{"@context":"https://schema.org","@graph":[{"@type":"ItemList","name":"Historical facts","url":"https://brazilianculture.biblioverse.org/history.html","numberOfItems":31,"itemListElement":[{"@type":"ListItem","position":1,"item":{"@type":"Thing","name":"The first peoples","description":"(First peoples · 13,000 years ago) Humans are already here, as shown at Lagoa Santa, Minas Gerais, where the skull of “Luzia” was found, and in the paintings of Serra da Capivara, Piauí."}},{"@type":"ListItem","position":2,"item":{"@type":"Thing","name":"A populated land","description":"(First peoples · Before 1500) Millions of people and over a thousand languages. In the Amazon there are traces of large settlements. Tupi, Jê and other groups occupy almost everything."}},{"@type":"ListItem","position":3,"item":{"@type":"Thing","name":"Cabral’s fleet","description":"(Colony · 1500) Pedro Álvares Cabral reaches Bahia. Pero Vaz de Caminha’s letter is considered Brazil’s “birth certificate”."}},{"@type":"ListItem","position":4,"item":{"@type":"Thing","name":"The captaincies","description":"(Colony · 1534) Portugal divides the land into strips granted to nobles. In 1549, Salvador becomes the first capital and the Jesuits arrive."}},{"@type":"ListItem","position":5,"item":{"@type":"Thing","name":"The African slave trade","description":"(Slavery · 1550) The largest slave trade in the Americas begins. It lasts over 300 years and brings almost 5 million people."}},{"@type":"ListItem","position":6,"item":{"@type":"Thing","name":"The Dutch in the Northeast","description":"(Colony · 1630) The Dutch West India Company takes Recife and Olinda for the sugar. Maurice of Nassau governs from 1637 to 1644, and the Dutch are expelled in 1654."}},{"@type":"ListItem","position":7,"item":{"@type":"Thing","name":"The fall of Palmares","description":"(Slavery · 1695) Zumbi dies, leader of the largest quilombo in history, at Serra da Barriga, Alagoas, which had held out for almost a hundred years."}},{"@type":"ListItem","position":8,"item":{"@type":"Thing","name":"The gold rush","description":"(Colony · 1695–1760) Gold in Minas Gerais brings settlement to the interior and baroque wealth, with Ouro Preto and Aleijadinho."}},{"@type":"ListItem","position":9,"item":{"@type":"Thing","name":"The Minas Conspiracy","description":"(Colony · 1789) A plot against gold taxes. Tiradentes is hanged in 1792."}},{"@type":"ListItem","position":10,"item":{"@type":"Thing","name":"The court flees to Rio","description":"(Empire · 1808) Dom João VI escapes Napoleon, brings the Portuguese court, opens the ports and creates Banco do Brasil and the Botanical Garden."}},{"@type":"ListItem","position":11,"item":{"@type":"Thing","name":"Independence","description":"(Empire · 1822) Dom Pedro I, son of the Portuguese king, breaks Brazil from Portugal on the banks of the Ipiranga and becomes emperor."}},{"@type":"ListItem","position":12,"item":{"@type":"Thing","name":"The reign of Dom Pedro II","description":"(Empire · 1840) Almost 50 years of relative stability, with coffee and immigration, while the country remains a slave society."}},{"@type":"ListItem","position":13,"item":{"@type":"Thing","name":"The Paraguayan War","description":"(Empire · 1864) South America’s largest conflict. Brazil, Argentina and Uruguay destroy Paraguay, with many Black soldiers fighting for Brazil."}},{"@type":"ListItem","position":14,"item":{"@type":"Thing","name":"Abolition","description":"(Slavery · 1888) The Golden Law frees the enslaved, with no compensation or land. Brazil was the last country in the Americas to do so."}},{"@type":"ListItem","position":15,"item":{"@type":"Thing","name":"The Republic","description":"(Republic · 1889) A military coup topples the monarchy. So begins the “Coffee with Milk Republic”, dominated by São Paulo and Minas Gerais."}},{"@type":"ListItem","position":16,"item":{"@type":"Thing","name":"The Japanese and other immigrants","description":"(Republic · 1908) The Kasato Maru brings the first Japanese. Italians, Germans, Arabs and Jews also came and changed the South and Southeast."}},{"@type":"ListItem","position":17,"item":{"@type":"Thing","name":"Modern Art Week","description":"(Culture · 1922) In São Paulo, young artists break with Europe. The Cannibalist Movement grows out of it."}},{"@type":"ListItem","position":18,"item":{"@type":"Thing","name":"The Vargas Era","description":"(Republic · 1930) Getúlio Vargas takes power, creates the labour code, Petrobras and the dictatorial Estado Novo, until 1945. He returns in 1951 and takes his own life in 1954."}},{"@type":"ListItem","position":19,"item":{"@type":"Thing","name":"The Maracanazo","description":"(Culture · 1950) The defeat to Uruguay in the home World Cup final is a national tragedy that Nelson Rodrigues called “our Hiroshima”."}},{"@type":"ListItem","position":20,"item":{"@type":"Thing","name":"The first title and bossa nova","description":"(Culture · 1958) Brazil wins the World Cup, with Pelé aged 17, and João Gilberto releases Chega de Saudade."}},{"@type":"ListItem","position":21,"item":{"@type":"Thing","name":"Brasília","description":"(Republic · 1960) JK opens the new capital on the Central Plateau, in 41 months, designed by Lúcio Costa and Niemeyer."}},{"@type":"ListItem","position":22,"item":{"@type":"Thing","name":"The military coup","description":"(Dictatorship · 1964) The military topples João Goulart. The dictatorship lasts 21 years, with censorship, torture and hundreds of dead and disappeared."}},{"@type":"ListItem","position":23,"item":{"@type":"Thing","name":"Diretas Já","description":"(Dictatorship · 1984) Millions take to the streets for direct presidential elections. The amendment is defeated, but the dictatorship ends the following year."}},{"@type":"ListItem","position":24,"item":{"@type":"Thing","name":"The Citizen Constitution","description":"(Democracy · 1988) The creation of the SUS public health system, guarantees for Indigenous and quilombola peoples, and democracy restored."}},{"@type":"ListItem","position":25,"item":{"@type":"Thing","name":"The Real Plan","description":"(Democracy · 1994) Hyperinflation ends, after reaching over 2,000% a year. 1994 also brings the fourth World Cup and the death of Senna."}},{"@type":"ListItem","position":26,"item":{"@type":"Thing","name":"Lula and the boom","description":"(Democracy · 2003) The former factory worker becomes president. The commodities boom and Bolsa Família lift millions out of poverty and Brazil leaves the UN Hunger Map."}},{"@type":"ListItem","position":27,"item":{"@type":"Thing","name":"World Cup, Car Wash and Olympics","description":"(Democracy · 2014–2016) The 7–1, the anti-corruption operation, recession, Dilma’s impeachment and the Rio Games."}},{"@type":"ListItem","position":28,"item":{"@type":"Thing","name":"The pandemic","description":"(Democracy · 2020) Brazil records over 700,000 Covid-19 deaths, one of the world’s worst totals."}},{"@type":"ListItem","position":29,"item":{"@type":"Thing","name":"8 January","description":"(Democracy · 2023) Bolsonaro supporters storm and ransack Congress, the Presidential Palace and the Supreme Court. In 2025, Bolsonaro is convicted of attempting a coup."}},{"@type":"ListItem","position":30,"item":{"@type":"Thing","name":"Oscar and COP30","description":"(Culture · 2025) I’m Still Here wins Brazil’s first International Feature Oscar and Belém hosts the UN climate conference."}},{"@type":"ListItem","position":31,"item":{"@type":"Thing","name":"Lula’s re-election","description":"(Democracy · 2026) In October, Lula beats Flávio Bolsonaro by 51.79% to 48.21% in a tight election and reaches a fourth term."}}]}]}</script>
