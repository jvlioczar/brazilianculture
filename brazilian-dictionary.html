<script type="application/ld+json" id="ld-content">{"@context":"https://schema.org","@graph":[{"@type":"DefinedTermSet","name":"Brazilian Dictionary","url":"https://brazilianculture.biblioverse.org/brazilian-dictionary.html","inLanguage":"en","hasDefinedTerm":[{"@type":"DefinedTerm","name":"Abestado","description":"Silly, a fool. Common in the Northeast"},{"@type":"DefinedTerm","name":"Aconchego","description":"Cosy warmth and comfort, as in a hug or a welcoming place"},{"@type":"DefinedTerm","name":"Arretado","description":"Awesome. In the Northeast it can also mean angry"},{"@type":"DefinedTerm","name":"Até logo","description":"See you later, even when there’s no date for the next meeting"},{"@type":"DefinedTerm","name":"Bah","description":"The southern interjection that does everything: surprise, agreement, outrage"},{"@type":"DefinedTerm","name":"Balada","description":"A party or a night out clubbing"},{"@type":"DefinedTerm","name":"Barraco","description":"A shack, or a loud scene in public"},{"@type":"DefinedTerm","name":"Beleza","description":"“All good?” or “deal”. Literally “beauty”"},{"@type":"DefinedTerm","name":"Bicho","description":"Literally “animal”: a way to call a mate, popular in the 60s and 70s"},{"@type":"DefinedTerm","name":"Boteco","description":"A simple neighbourhood bar, with tables on the pavement"},{"@type":"DefinedTerm","name":"Busão","description":"The bus"},{"@type":"DefinedTerm","name":"Cafuné","description":"Tenderly running your fingers through someone’s hair. Many say it’s untranslatable"},{"@type":"DefinedTerm","name":"Cara","description":"Literally “face”: a guy, or what you call anyone"},{"@type":"DefinedTerm","name":"Chique no último","description":"Super classy"},{"@type":"DefinedTerm","name":"Churras","description":"Barbecue, the basic social gathering"},{"@type":"DefinedTerm","name":"Coé","description":"“What’s up?”, the Rio greeting"},{"@type":"DefinedTerm","name":"Com Deus","description":"“With God”: an affectionate goodbye, short for “vai com Deus”, “go with God”"},{"@type":"DefinedTerm","name":"Crem deus pai","description":"From “Creio em Deus Pai”, “I believe in God the Father”: good grief, heaven help us"},{"@type":"DefinedTerm","name":"Cê","description":"“You”, shortened"},{"@type":"DefinedTerm","name":"Dar um jeito","description":"To work it out somehow, even if you don’t know how yet"},{"@type":"DefinedTerm","name":"De boa","description":"All good, no worries"},{"@type":"DefinedTerm","name":"Dá um pulo lá em casa","description":"“Drop by sometime.” A vague invitation. Probably no one will, and that’s fine"},{"@type":"DefinedTerm","name":"E aí","description":"The casual hello: “hey, what’s up?”"},{"@type":"DefinedTerm","name":"Eita","description":"“Whoa!” or “uh-oh!”. Surprise or worry for almost any occasion, sometimes doubled: “eita, eita!”"},{"@type":"DefinedTerm","name":"Encher linguiça","description":"Literally “stuffing sausage”: padding things out, talking to fill time"},{"@type":"DefinedTerm","name":"Fazer vaquinha","description":"“Making a little cow”: chipping in together for something"},{"@type":"DefinedTerm","name":"Feijão com arroz","description":"“Beans and rice”: the basics done well"},{"@type":"DefinedTerm","name":"Fio","description":"A thong bikini, or a shortening of “meu filho”, “my son”"},{"@type":"DefinedTerm","name":"Firmeza","description":"All good, solid, reliable"},{"@type":"DefinedTerm","name":"Fofoca","description":"Gossip, a national sport"},{"@type":"DefinedTerm","name":"Galera","description":"The crew, everyone"},{"@type":"DefinedTerm","name":"Gambiarra","description":"A clever makeshift fix that more or less works"},{"@type":"DefinedTerm","name":"Gato / Gata","description":"Literally “cat”: a hot guy or girl. Also an illegal power hook-up"},{"@type":"DefinedTerm","name":"Gente","description":"People, “we”, and an interjection: “Gente!”, “oh my!”"},{"@type":"DefinedTerm","name":"Grana","description":"Money"},{"@type":"DefinedTerm","name":"Jeitinho","description":"A friendly workaround, often bending the rules"},{"@type":"DefinedTerm","name":"Legal","description":"Cool, nice. Not “legal” in the English sense"},{"@type":"DefinedTerm","name":"Mano","description":"Bro. A hallmark of São Paulo speech"},{"@type":"DefinedTerm","name":"Massa","description":"Awesome, really cool"},{"@type":"DefinedTerm","name":"Meu","description":"Literally “my”: São Paulo’s “dude”, as in “meu, look at this”"},{"@type":"DefinedTerm","name":"Moleza","description":"Easy-peasy"},{"@type":"DefinedTerm","name":"Nossa","description":"From “Nossa Senhora” (Our Lady): “wow!”"},{"@type":"DefinedTerm","name":"Oxente","description":"A northeastern interjection of surprise"},{"@type":"DefinedTerm","name":"Oxi","description":"The short form of “oxente”: “huh?”, surprise or puzzlement"},{"@type":"DefinedTerm","name":"Pão-duro","description":"“Hard bread”: a cheapskate"},{"@type":"DefinedTerm","name":"Parça","description":"Partner, trusted mate"},{"@type":"DefinedTerm","name":"Partiu","description":"“Let’s go!”"},{"@type":"DefinedTerm","name":"Pelada","description":"An informal kickabout among friends"},{"@type":"DefinedTerm","name":"Pô","description":"A very Rio interjection: “come on”, “dang”"},{"@type":"DefinedTerm","name":"Puxar o saco","description":"To suck up to someone"},{"@type":"DefinedTerm","name":"Quebrar o galho","description":"“Breaking the branch”: helping out or patching things up for now"},{"@type":"DefinedTerm","name":"Rolê","description":"An outing, a stroll"},{"@type":"DefinedTerm","name":"Saudade","description":"Missing someone, somewhere or some time, with love. The language’s proudest word"},{"@type":"DefinedTerm","name":"Show de bola","description":"Excellent"},{"@type":"DefinedTerm","name":"Sextou","description":"“It’s Friday-ed”: TGIF"},{"@type":"DefinedTerm","name":"Sinistro","description":"Something incredible or something dangerous, depending on the tone"},{"@type":"DefinedTerm","name":"Tá ligado?","description":"“You know?” at the end of a sentence"},{"@type":"DefinedTerm","name":"Tamo junto","description":"“We’re together”: I’ve got your back. Also a way to say goodbye"},{"@type":"DefinedTerm","name":"Tchê","description":"How southerners address each other"},{"@type":"DefinedTerm","name":"Tipo","description":"The filler word “like”: “tipo assim…”"},{"@type":"DefinedTerm","name":"Trem","description":"Literally “train”. In Minas Gerais, it means any thing at all: “pass me that trem”"},{"@type":"DefinedTerm","name":"Tranquilo","description":"No worries"},{"@type":"DefinedTerm","name":"Uai","description":"The Minas Gerais interjection of surprise or doubt"},{"@type":"DefinedTerm","name":"Valeu","description":"Casual “thanks”, or “bye”"},{"@type":"DefinedTerm","name":"Véi","description":"From “velho”, “old man”: a casual way to call a mate, however young"},{"@type":"DefinedTerm","name":"Vixe","description":"“Yikes.” From “Virgem Maria”, Virgin Mary"},{"@type":"DefinedTerm","name":"Zoar","description":"To tease, to banter"}]}]}</script>
