<script type="application/ld+json" id="ld-content">{"@context":"https://schema.org","@graph":[{"@type":"ItemList","name":"Fun facts","url":"https://brazilianculture.biblioverse.org/fun-facts.html","numberOfItems":21,"itemListElement":[{"@type":"ListItem","position":1,"item":{"@type":"Thing","name":"Named after a tree","description":"Brazil comes from brazilwood, a tree with reddish wood and the first resource to be exploited. Before that, the Tupi called the land Pindorama, “land of palms”."}},{"@type":"ListItem","position":2,"item":{"@type":"Thing","name":"The flag is a sky","description":"The blue circle shows the sky over Rio on the morning of 15 November 1889, as if seen from outside the globe. Each star stands for a state. The green and yellow come from the imperial family, not from the forest and gold."}},{"@type":"ListItem","position":3,"item":{"@type":"Thing","name":"One of a kind on the continent","description":"Brazil is the only Portuguese-speaking country in the Americas and it borders almost all its neighbours, except Chile and Ecuador."}},{"@type":"ListItem","position":4,"item":{"@type":"Thing","name":"A difficult anthem","description":"The national anthem has two parts and words most people never use otherwise. Almost no one knows all of it, but sung a cappella in a stadium it gives you goosebumps."}},{"@type":"ListItem","position":5,"item":{"@type":"Thing","name":"The planned capital","description":"Brasília was built in 41 months and, seen from above, looks like a plane. Before it, the capitals were Salvador and Rio."}},{"@type":"ListItem","position":6,"item":{"@type":"Thing","name":"It was the capital of Portugal","description":"Rio was the seat of the Portuguese Empire from 1808 to 1821, after the court fled Napoleon. It’s the only case of a colony becoming the centre of a European empire."}},{"@type":"ListItem","position":7,"item":{"@type":"Thing","name":"Over a thousand languages","description":"There were probably more than a thousand Indigenous languages in 1500. According to the 2022 Census, 295 remain, and Nheengatu is still official in São Gabriel da Cachoeira, Amazonas."}},{"@type":"ListItem","position":8,"item":{"@type":"Thing","name":"Tupi everywhere","description":"Abacaxi (pineapple), jacaré (caiman), Ipanema, Itaú, Curitiba, pipoca (popcorn), carioca: thousands of Brazilian Portuguese words have Indigenous roots. Moqueca, samba, cafuné and bunda (bum) come from African languages."}},{"@type":"ListItem","position":9,"item":{"@type":"Thing","name":"Christmas in flip-flops","description":"It’s the Southern Hemisphere, so Christmas falls in high summer: Santa in a coat at 35 degrees and dinner at midnight on the 24th."}},{"@type":"ListItem","position":10,"item":{"@type":"Thing","name":"Cheek kisses: how many?","description":"One in São Paulo, two in Rio, three in Minas, and sometimes none. There’s no national rule and someone’s always left hanging."}},{"@type":"ListItem","position":11,"item":{"@type":"Thing","name":"Showers are sacred","description":"Brazilians are among the people who shower most in the world, a habit often credited to Indigenous heritage. Many shower more than once a day."}},{"@type":"ListItem","position":12,"item":{"@type":"Thing","name":"Time is a concept","description":"A party set for eight starts at ten, and turning up at eight is embarrassing. Work meetings, though, tend to be more punctual."}},{"@type":"ListItem","position":13,"item":{"@type":"Thing","name":"First names and nicknames","description":"Pelé, Ronaldinho, Xuxa, Lula: Brazilians call even presidents by their nicknames. Lula actually added his to his legal name."}},{"@type":"ListItem","position":14,"item":{"@type":"Thing","name":"Saudade has its own day","description":"Saudade Day is 30 January. And yes, many Brazilians say the word doesn’t exist in any other language, though it’s shared with the Portuguese of Portugal."}},{"@type":"ListItem","position":15,"item":{"@type":"Thing","name":"Compulsory voting","description":"Voting is compulsory from 18 to 70 and optional from 16. Results come out the same night and the country follows live."}},{"@type":"ListItem","position":16,"item":{"@type":"Thing","name":"It does snow","description":"Snow is very rare, but it does fall in southern mountain towns such as São Joaquim, Santa Catarina. It makes the national news and draws tourists."}},{"@type":"ListItem","position":17,"item":{"@type":"Thing","name":"The animal game","description":"The jogo do bicho was created in 1892 at Rio’s Vila Isabel zoo to attract visitors. It has been an illegal lottery for decades, is still everywhere and has great influence in the samba schools."}},{"@type":"ListItem","position":18,"item":{"@type":"Thing","name":"Pix on the sand","description":"Popcorn carts, iced mate sellers on the beach, Globo biscuits: the informal economy is part of the landscape, and these days you pay by Pix."}},{"@type":"ListItem","position":19,"item":{"@type":"Thing","name":"Carnival everywhere","description":"Carnival isn’t one party: Rio has parades and blocos, Salvador has sound trucks, Recife and Olinda have frevo and giant puppets. Each swears theirs is the best."}},{"@type":"ListItem","position":20,"item":{"@type":"Thing","name":"A mix of faiths","description":"It’s the world’s largest Catholic country, has a large evangelical population, and many people also attend Candomblé and Umbanda temples. Throwing flowers to the sea goddess Iemanjá on New Year’s Eve is for people of many beliefs."}},{"@type":"ListItem","position":21,"item":{"@type":"Thing","name":"The letter K","description":"Written laughter in Brazil is “kkkkk”, or even “rsrs”. A short “kk” seems cold, so people fill the screen."}}]}]}</script>
