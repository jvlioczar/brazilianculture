<script type="application/ld+json" id="ld-content">{"@context":"https://schema.org","@graph":[{"@type":"ItemList","name":"No prato de todo dia","url":"https://brazilianculture.biblioverse.org/pt/comida.html","numberOfItems":6,"itemListElement":[{"@type":"ListItem","position":1,"item":{"@type":"Thing","name":"Arroz com feijão","description":"O par mais presente da mesa, geralmente com salada, uma carne e farofa."}},{"@type":"ListItem","position":2,"item":{"@type":"Thing","name":"Café da manhã","description":"Pão francês com manteiga, café com leite e fruta. O pão fresco vem da padaria da esquina."}},{"@type":"ListItem","position":3,"item":{"@type":"Thing","name":"Prato feito","description":"O “PF” ou o quilo: almoço barato em que você paga pelo peso ou leva um prato completo."}},{"@type":"ListItem","position":4,"item":{"@type":"Thing","name":"Salgado de padaria","description":"Coxinha, esfiha ou empada com refrigerante resolve o lanche em todo o país."}},{"@type":"ListItem","position":5,"item":{"@type":"Thing","name":"Frutas","description":"Banana, manga, mamão e laranja são baratos o ano inteiro."}},{"@type":"ListItem","position":6,"item":{"@type":"Thing","name":"Almoço de domingo","description":"A família reunida na mesa com macarronada, frango assado ou churrasco."}}]},{"@type":"ItemList","name":"Pratos, salgados, doces e bebidas","url":"https://brazilianculture.biblioverse.org/pt/comida.html","numberOfItems":29,"itemListElement":[{"@type":"ListItem","position":1,"item":{"@type":"Thing","name":"Feijoada","description":"(Pratos) Feijão-preto cozido com carnes de porco, servido com arroz, couve, farofa e laranja. É o almoço de sábado por excelência."}},{"@type":"ListItem","position":2,"item":{"@type":"Thing","name":"Moqueca","description":"(Pratos) Peixe cozido em panela de barro. Na versão baiana, leva azeite de dendê e leite de coco; na capixaba, urucum. E há quem brigue por isso."}},{"@type":"ListItem","position":3,"item":{"@type":"Thing","name":"Churrasco","description":"(Pratos) Nasceu nos pampas do Sul e virou o programa de domingo. O corte rei é a picanha, de preferência só com sal grosso."}},{"@type":"ListItem","position":4,"item":{"@type":"Thing","name":"Acarajé","description":"(Pratos) Bolinho de feijão-fradinho frito no dendê, recheado com vatapá e camarão. Comida de santo vendida pelas baianas, reconhecidas como patrimônio do Brasil."}},{"@type":"ListItem","position":5,"item":{"@type":"Thing","name":"Baião de dois","description":"(Pratos) Arroz e feijão cozidos juntos, com queijo coalho e carne de sol: o sertão num prato só."}},{"@type":"ListItem","position":6,"item":{"@type":"Thing","name":"Tacacá e açaí de verdade","description":"(Pratos) Tucupi quente com jambu, a erva que faz a boca tremer. No Pará, o açaí é salgado, comido com peixe e farinha, bem longe da tigela de academia."}},{"@type":"ListItem","position":7,"item":{"@type":"Thing","name":"Arroz e feijão","description":"(Pratos) A dupla base do prato nacional. Sem ele, para muita gente, ainda não foi almoço."}},{"@type":"ListItem","position":8,"item":{"@type":"Thing","name":"Pão de queijo","description":"(Salgados) Mineiro, sem glúten por natureza, feito com polvilho de mandioca e queijo. Vai bem com café a qualquer hora."}},{"@type":"ListItem","position":9,"item":{"@type":"Thing","name":"Coxinha","description":"(Salgados) Massa em formato de coxa, recheada de frango e frita. A rainha das lanchonetes e dos aniversários."}},{"@type":"ListItem","position":10,"item":{"@type":"Thing","name":"Pastel de feira","description":"(Salgados) Massa fina, frita na hora, servida com caldo de cana. Herança dos imigrantes japoneses e chineses em São Paulo."}},{"@type":"ListItem","position":11,"item":{"@type":"Thing","name":"Brigadeiro","description":"(Doces) Chocolate, leite condensado e granulado. Nasceu nos anos 1940, ligado à campanha do brigadeiro Eduardo Gomes, e não há festa sem ele."}},{"@type":"ListItem","position":12,"item":{"@type":"Thing","name":"Beijinho e cajuzinho","description":"(Doces) Os parceiros do brigadeiro na mesa de festa: um de coco com cravo, o outro de amendoim."}},{"@type":"ListItem","position":13,"item":{"@type":"Thing","name":"Romeu e Julieta","description":"(Doces) Goiabada com queijo minas. A combinação perfeita: doce e salgado no mesmo garfo."}},{"@type":"ListItem","position":14,"item":{"@type":"Thing","name":"Quindim","description":"(Doces) Gema, açúcar e coco, numa fusão de doces portugueses de convento com ingredientes da África e do Brasil."}},{"@type":"ListItem","position":15,"item":{"@type":"Thing","name":"Paçoca","description":"(Doces) Amendoim moído com açúcar. Antes de virar doce, o nome tupi designava uma mistura de carne e farinha."}},{"@type":"ListItem","position":16,"item":{"@type":"Thing","name":"Pudim de leite condensado","description":"(Doces) Com calda de caramelo, é a sobremesa do almoço de domingo de todos os lares."}},{"@type":"ListItem","position":17,"item":{"@type":"Thing","name":"Mandioca e farinha","description":"(Ingredientes) O alimento-base dos povos indígenas. Aparece cozida, frita, como tapioca, polvilho, tucupi e farofa, que os brasileiros põem em quase tudo."}},{"@type":"ListItem","position":18,"item":{"@type":"Thing","name":"Tapioca","description":"(Ingredientes) Goma de mandioca feita em frigideira, recheada de tudo. Tecnologia indígena que hoje é moda em todo o país."}},{"@type":"ListItem","position":19,"item":{"@type":"Thing","name":"Dendê","description":"(Ingredientes) O azeite de palma alaranjado, vindo da África, que dá à cozinha baiana o sabor e a cor."}},{"@type":"ListItem","position":20,"item":{"@type":"Thing","name":"Frutas nativas","description":"(Ingredientes) Cupuaçu, jabuticaba, caju, pitanga, cajá, graviola, açaí. Boa parte delas nem tem tradução para o inglês."}},{"@type":"ListItem","position":21,"item":{"@type":"Thing","name":"Cafézinho","description":"(Bebidas) Forte, pequeno, doce. O Brasil é o maior produtor mundial de café há mais de 150 anos, e oferecer um é o gesto básico de hospitalidade."}},{"@type":"ListItem","position":22,"item":{"@type":"Thing","name":"Caipirinha","description":"(Bebidas) Cachaça, limão, açúcar e gelo. Patrimônio nacional, o drinque brasileiro mais famoso do mundo."}},{"@type":"ListItem","position":23,"item":{"@type":"Thing","name":"Cachaça","description":"(Bebidas) Destilado de cana-de-açúcar com denominação própria e milhares de marcas e de apelidos: branquinha, marvada, pinga."}},{"@type":"ListItem","position":24,"item":{"@type":"Thing","name":"Chimarrão","description":"(Bebidas) Erva-mate em cuia, com bomba de metal e água quente, herança guarani. Em Porto Alegre, anda com a pessoa até na rua."}},{"@type":"ListItem","position":25,"item":{"@type":"Thing","name":"Tereré","description":"(Bebidas) O irmão gelado do chimarrão, comum no Mato Grosso do Sul."}},{"@type":"ListItem","position":26,"item":{"@type":"Thing","name":"Caldo de cana","description":"(Bebidas) Cana moída na hora, com limão ou abacaxi, parceiro obrigatório do pastel."}},{"@type":"ListItem","position":27,"item":{"@type":"Thing","name":"Guaraná","description":"(Bebidas) Fruta da Amazônia usada pelos Sateré-Mawé e cheia de cafeína. Virou refrigerante e pó energético."}},{"@type":"ListItem","position":28,"item":{"@type":"Thing","name":"Vinagrete","description":"(Ingredientes) Tomate, cebola, pimentão, vinagre e azeite picados bem miúdo. Sem ele, o churrasco e a farofa ficam incompletos."}},{"@type":"ListItem","position":29,"item":{"@type":"Thing","name":"Pequi","description":"(Ingredientes) O fruto do Cerrado, de cheiro fortíssimo e sabor marcante, no arroz com pequi goiano. Cuidado: tem espinhos por dentro, e não se morde."}}]}]}</script>
