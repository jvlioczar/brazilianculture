<script type="application/ld+json" id="ld-content">{"@context":"https://schema.org","@graph":[{"@type":"ItemList","name":"Fatos históricos","url":"https://brazilianculture.biblioverse.org/pt/historia.html","numberOfItems":31,"itemListElement":[{"@type":"ListItem","position":1,"item":{"@type":"Thing","name":"Os primeiros povos","description":"(Povos originários · Há 13 mil anos) Grupos humanos já ocupam o território, como mostram sítios de Lagoa Santa (MG), onde foi achado o crânio de Luzia, e pinturas da Serra da Capivara (PI)."}},{"@type":"ListItem","position":2,"item":{"@type":"Thing","name":"Um continente povoado","description":"(Povos originários · Até 1500) Milhões de pessoas e mais de mil línguas. Na Amazônia, há vestígios de grandes cidades. Tupis, Jês e outros grupos ocupam quase tudo."}},{"@type":"ListItem","position":3,"item":{"@type":"Thing","name":"A frota de Cabral","description":"(Colônia · 1500) Pedro Álvares Cabral chega à Bahia. A carta de Pero Vaz de Caminha é considerada a “certidão de nascimento” do Brasil."}},{"@type":"ListItem","position":4,"item":{"@type":"Thing","name":"As capitanias","description":"(Colônia · 1534) Portugal divide a terra em faixas doadas a nobres. Em 1549, Salvador vira a primeira capital, e chegam os jesuítas."}},{"@type":"ListItem","position":5,"item":{"@type":"Thing","name":"O tráfico de africanos","description":"(Escravidão · 1550) Começa o maior tráfico de escravizados das Américas, que dura mais de 300 anos e traz quase 5 milhões de pessoas."}},{"@type":"ListItem","position":6,"item":{"@type":"Thing","name":"Os holandeses no Nordeste","description":"(Colônia · 1630) A Companhia das Índias Ocidentais toma Recife e Olinda, atrás do açúcar. Maurício de Nassau governa de 1637 a 1644, e os holandeses são expulsos em 1654."}},{"@type":"ListItem","position":7,"item":{"@type":"Thing","name":"A queda de Palmares","description":"(Escravidão · 1695) Morre Zumbi, líder do maior quilombo da história, na Serra da Barriga (AL), resistente por quase cem anos."}},{"@type":"ListItem","position":8,"item":{"@type":"Thing","name":"A corrida do ouro","description":"(Colônia · 1695–1760) O ouro em Minas leva a povoamento do interior e à riqueza barroca, com Ouro Preto e Aleijadinho."}},{"@type":"ListItem","position":9,"item":{"@type":"Thing","name":"A Inconfidência Mineira","description":"(Colônia · 1789) Conspiração contra os impostos sobre o ouro. Tiradentes é enforcado em 1792."}},{"@type":"ListItem","position":10,"item":{"@type":"Thing","name":"A corte foge para o Rio","description":"(Império · 1808) Dom João VI escapa de Napoleão e leva a corte portuguesa, abre os portos e cria o Banco do Brasil e o Jardim Botânico."}},{"@type":"ListItem","position":11,"item":{"@type":"Thing","name":"A Independência","description":"(Império · 1822) Dom Pedro I, filho do rei português, separa o Brasil de Portugal às margens do Ipiranga e vira imperador."}},{"@type":"ListItem","position":12,"item":{"@type":"Thing","name":"O reinado de dom Pedro II","description":"(Império · 1840) Quase 50 anos de relativa estabilidade, com o café e a imigração, enquanto o país segue escravista."}},{"@type":"ListItem","position":13,"item":{"@type":"Thing","name":"A Guerra do Paraguai","description":"(Império · 1864) O maior conflito da América do Sul. Brasil, Argentina e Uruguai destroem o Paraguai, com muitos negros lutando pelo Brasil."}},{"@type":"ListItem","position":14,"item":{"@type":"Thing","name":"A Abolição","description":"(Escravidão · 1888) A Lei Áurea liberta os escravizados, sem nenhuma indenização ou terra. O Brasil foi o último país das Américas a fazê-lo."}},{"@type":"ListItem","position":15,"item":{"@type":"Thing","name":"A República","description":"(República · 1889) Um golpe militar derruba a monarquia. Começa a “República do Café com Leite”, dominada por São Paulo e Minas."}},{"@type":"ListItem","position":16,"item":{"@type":"Thing","name":"Os japoneses e outros imigrantes","description":"(República · 1908) O Kasato Maru traz os primeiros japoneses. Vieram também italianos, alemães, árabes e judeus, que mudaram o Sul e o Sudeste."}},{"@type":"ListItem","position":17,"item":{"@type":"Thing","name":"A Semana de Arte Moderna","description":"(Cultura · 1922) Em São Paulo, jovens artistas rompem com a Europa. Dali sai o Movimento Antropofágico."}},{"@type":"ListItem","position":18,"item":{"@type":"Thing","name":"A Era Vargas","description":"(República · 1930) Getúlio Vargas toma o poder, cria a CLT, a Petrobras e um Estado Novo ditatorial, até 1945. Volta em 1951 e se suicida em 1954."}},{"@type":"ListItem","position":19,"item":{"@type":"Thing","name":"O Maracanazo","description":"(Cultura · 1950) A derrota para o Uruguai na final da Copa em casa é tragédia nacional, que Nelson Rodrigues chamou de “nossa Hiroshima”."}},{"@type":"ListItem","position":20,"item":{"@type":"Thing","name":"O primeiro título e a bossa","description":"(Cultura · 1958) O Brasil vence a Copa, com Pelé aos 17 anos, e João Gilberto lança Chega de Saudade."}},{"@type":"ListItem","position":21,"item":{"@type":"Thing","name":"Brasília","description":"(República · 1960) JK inaugura a nova capital no Planalto Central, em 41 meses, com projeto de Lúcio Costa e Niemeyer."}},{"@type":"ListItem","position":22,"item":{"@type":"Thing","name":"O golpe militar","description":"(Ditadura · 1964) Os militares derrubam João Goulart. A ditadura dura 21 anos, com censura, tortura e centenas de mortos e desaparecidos."}},{"@type":"ListItem","position":23,"item":{"@type":"Thing","name":"As Diretas Já","description":"(Ditadura · 1984) Milhões vão às ruas por eleições diretas para presidente. A emenda é derrotada, mas a ditadura termina no ano seguinte."}},{"@type":"ListItem","position":24,"item":{"@type":"Thing","name":"A Constituição Cidadã","description":"(Democracia · 1988) Criação do SUS, garantias aos indígenas e quilombolas, e democracia restabelecida."}},{"@type":"ListItem","position":25,"item":{"@type":"Thing","name":"O Plano Real","description":"(Democracia · 1994) Acaba a hiperinflação, que chegou a mais de 2.000% ao ano. Em 1994, o tetra e a morte de Senna."}},{"@type":"ListItem","position":26,"item":{"@type":"Thing","name":"Lula e o boom","description":"(Democracia · 2003) O ex-operário chega à presidência. O boom das commodities e o Bolsa Família tiram milhões da pobreza e o Brasil sai do Mapa da Fome."}},{"@type":"ListItem","position":27,"item":{"@type":"Thing","name":"Copa, Lava Jato e Olimpíada","description":"(Democracia · 2014–2016) O 7 a 1, a operação contra a corrupção, a recessão, o impeachment de Dilma e os Jogos do Rio."}},{"@type":"ListItem","position":28,"item":{"@type":"Thing","name":"A pandemia","description":"(Democracia · 2020) O Brasil soma mais de 700 mil mortes por Covid-19, um dos piores números do mundo."}},{"@type":"ListItem","position":29,"item":{"@type":"Thing","name":"O 8 de janeiro","description":"(Democracia · 2023) Apoiadores de Bolsonaro invadem e depredam o Congresso, o Planalto e o STF. Em 2025, Bolsonaro é condenado por tentativa de golpe."}},{"@type":"ListItem","position":30,"item":{"@type":"Thing","name":"Oscar e COP30","description":"(Cultura · 2025) Ainda Estou Aqui traz o primeiro Oscar internacional, e Belém recebe a conferência do clima da ONU."}},{"@type":"ListItem","position":31,"item":{"@type":"Thing","name":"A reeleição de Lula","description":"(Democracia · 2026) Em outubro, Lula vence Flávio Bolsonaro por 51,79% a 48,21%, em uma eleição apertada, e chega ao quarto mandato."}}]}]}</script>
