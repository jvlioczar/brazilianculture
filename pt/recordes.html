<script type="application/ld+json" id="ld-content">{"@context":"https://schema.org","@graph":[{"@type":"ItemList","name":"Recordes e índices","url":"https://brazilianculture.biblioverse.org/pt/recordes.html","numberOfItems":17,"itemListElement":[{"@type":"ListItem","position":1,"item":{"@type":"Thing","name":"Mais Copas do Mundo","description":"(Esporte · 5 títulos) O único país pentacampeão (1958, 1962, 1970, 1994 e 2002) e o único a jogar todas as edições."}},{"@type":"ListItem","position":2,"item":{"@type":"Thing","name":"A maior floresta tropical","description":"(Natureza · 5,5 mi km²) Cerca de 60% da Amazônia fica no Brasil. É a maior floresta tropical do mundo, e abriga cerca de uma em cada dez espécies conhecidas."}},{"@type":"ListItem","position":3,"item":{"@type":"Thing","name":"O maior rio em volume","description":"(Natureza · 1º) O Amazonas despeja mais água no oceano do que os sete rios seguintes somados."}},{"@type":"ListItem","position":4,"item":{"@type":"Thing","name":"A maior planície alagável","description":"(Natureza · 150 mil km²) O Pantanal é a maior área úmida tropical contínua do planeta, a maior parte no Brasil."}},{"@type":"ListItem","position":5,"item":{"@type":"Thing","name":"A maior biodiversidade","description":"(Natureza · 1º) O Brasil é o país com maior diversidade biológica do mundo, com cerca de 20% das espécies do planeta, em seis biomas."}},{"@type":"ListItem","position":6,"item":{"@type":"Thing","name":"Maior produtor de café","description":"(Economia · 1º) Desde o século 19, cerca de um terço do café do mundo sai do Brasil, que lidera também em suco de laranja e soja."}},{"@type":"ListItem","position":7,"item":{"@type":"Thing","name":"Itaipu","description":"(Engenharia · 14 GW) Binacional com o Paraguai, é a hidrelétrica que mais gerou energia acumulada na história e foi a maior do mundo até a chinesa Três Gargantas."}},{"@type":"ListItem","position":8,"item":{"@type":"Thing","name":"O maior bloco de Carnaval","description":"(Cultura · 2 mi+) O Galo da Madrugada, no Recife, entrou no Guinness em 1995 e costuma reunir mais de 2 milhões de pessoas no sábado de Zé Pereira."}},{"@type":"ListItem","position":9,"item":{"@type":"Thing","name":"O maior público no futebol","description":"(Esporte · 199 mil) A estimativa de público na derrota para o Uruguai, no Maracanã, em 1950, o “Maracanazo”. Nunca mais se viu tanta gente num jogo de Copa."}},{"@type":"ListItem","position":10,"item":{"@type":"Thing","name":"Os Lençóis Maranhenses","description":"(Natureza · 1.550 km²) Dunas brancas com lagoas de água da chuva, um fenômeno raro no mundo. Patrimônio Natural da Humanidade desde 2024."}},{"@type":"ListItem","position":11,"item":{"@type":"Thing","name":"A maior comunidade japonesa","description":"(Gente · 2 milhões) O Brasil abriga a maior população de origem japonesa fora do Japão, desde o navio Kasato Maru, de 1908."}},{"@type":"ListItem","position":12,"item":{"@type":"Thing","name":"O maior destino do tráfico de escravizados","description":"(Gente · 5 milhões) Quase 5 milhões de africanos foram trazidos à força, cerca de 40% de todo o tráfico atlântico. Foi o último país das Américas a abolir a escravidão."}},{"@type":"ListItem","position":13,"item":{"@type":"Thing","name":"O maior cajueiro do mundo","description":"(Natureza · 8.500 m²) Em Pirangi do Norte (RN), uma mutação fez os galhos enraizarem e formarem uma copa enorme, com apenas uma árvore."}},{"@type":"ListItem","position":14,"item":{"@type":"Thing","name":"Um dos países mais desiguais","description":"(Economia · Top 10) Sem disfarce: o Brasil está sempre entre os países de maior desigualdade do mundo, com renda muito concentrada no topo."}},{"@type":"ListItem","position":15,"item":{"@type":"Thing","name":"A maior comunidade libanesa","description":"(Gente · 3 a 10 mi) É citada como a maior fora do Líbano, talvez maior que a população do próprio país. Mas não há contagem oficial: as estimativas vão de 3 a 10 milhões de descendentes."}},{"@type":"ListItem","position":16,"item":{"@type":"Thing","name":"A maior economia da América do Sul","description":"(Economia · 1ª) O Brasil é o país de maior PIB do continente, mas não o mais rico por pessoa: nesse critério, fica atrás de Guiana, Uruguai e Chile."}},{"@type":"ListItem","position":17,"item":{"@type":"Thing","name":"São Paulo frente às maiores cidades","description":"(Gente · 21 mi) A Grande São Paulo tem cerca de 21 milhões de pessoas e está entre as maiores do mundo, mas longe do topo: pela ONU, em 2025, a mais populosa é Jacarta, com cerca de 42 milhões, o dobro."}}]}]}</script>
