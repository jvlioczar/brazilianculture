<script type="application/ld+json" id="ld-content">{"@context":"https://schema.org","@graph":[{"@type":"DefinedTermSet","name":"Dicionário Brasileiro","url":"https://brazilianculture.biblioverse.org/pt/dicionario.html","inLanguage":"pt-BR","hasDefinedTerm":[{"@type":"DefinedTerm","name":"Abestado","description":"Bobo, tolo. Comum no Nordeste"},{"@type":"DefinedTerm","name":"Aconchego","description":"Sensação de carinho, abrigo e conforto, num abraço ou num lugar acolhedor"},{"@type":"DefinedTerm","name":"Arretado","description":"Excelente, muito bom. No Nordeste, também pode ser bravo"},{"@type":"DefinedTerm","name":"Até logo","description":"Despedida, mesmo quando não há data para o reencontro"},{"@type":"DefinedTerm","name":"Bah","description":"A interjeição gaúcha que serve para tudo: surpresa, concordância, indignação"},{"@type":"DefinedTerm","name":"Balada","description":"Festa, noite em boate"},{"@type":"DefinedTerm","name":"Barraco","description":"Casa simples, ou uma briga escandalosa em público"},{"@type":"DefinedTerm","name":"Beleza","description":"“Tudo bem?”, ou “combinado”"},{"@type":"DefinedTerm","name":"Bicho","description":"Forma de chamar um amigo, popular nos anos 60 e 70"},{"@type":"DefinedTerm","name":"Boteco","description":"Barzinho simples, de mesa na calçada"},{"@type":"DefinedTerm","name":"Busão","description":"Ônibus"},{"@type":"DefinedTerm","name":"Cafuné","description":"Carinho nos cabelos de alguém. Muitos dizem que é intraduzível"},{"@type":"DefinedTerm","name":"Cara","description":"Um sujeito, ou um vocativo para qualquer um"},{"@type":"DefinedTerm","name":"Chique no último","description":"Elegantíssimo"},{"@type":"DefinedTerm","name":"Churras","description":"Churrasco, o encontro social básico"},{"@type":"DefinedTerm","name":"Coé","description":"“Qual é?”. Cumprimento carioca"},{"@type":"DefinedTerm","name":"Com Deus","description":"Despedida carinhosa: “vai com Deus”, abreviado"},{"@type":"DefinedTerm","name":"Crem deus pai","description":"De “Creio em Deus Pai”: expressão de espanto ou medo"},{"@type":"DefinedTerm","name":"Cê","description":"Você, abreviado"},{"@type":"DefinedTerm","name":"Dar um jeito","description":"Resolver de algum modo, mesmo sem saber como ainda"},{"@type":"DefinedTerm","name":"De boa","description":"Tranquilo, sem problema"},{"@type":"DefinedTerm","name":"Dá um pulo lá em casa","description":"Convite vago. Provavelmente ninguém vai, e tudo bem"},{"@type":"DefinedTerm","name":"E aí","description":"O “oi” informal, com ou sem “beleza”"},{"@type":"DefinedTerm","name":"Eita","description":"Espanto, surpresa ou preocupação. Serve para quase tudo, às vezes em dose dupla: “eita, eita!”"},{"@type":"DefinedTerm","name":"Encher linguiça","description":"Falar muito para ocupar tempo ou espaço"},{"@type":"DefinedTerm","name":"Fazer vaquinha","description":"Juntar dinheiro entre várias pessoas"},{"@type":"DefinedTerm","name":"Feijão com arroz","description":"O básico bem feito, o trivial"},{"@type":"DefinedTerm","name":"Fio","description":"Fio dental, biquíni mínimo, ou “meu filho”"},{"@type":"DefinedTerm","name":"Firmeza","description":"Tudo certo, confiável"},{"@type":"DefinedTerm","name":"Fofoca","description":"Conversa sobre a vida alheia, um esporte nacional"},{"@type":"DefinedTerm","name":"Galera","description":"A turma, o pessoal"},{"@type":"DefinedTerm","name":"Gambiarra","description":"Conserto improvisado e criativo que dá certo, mais ou menos"},{"@type":"DefinedTerm","name":"Gato / Gata","description":"Pessoa bonita. Ou uma ligação clandestina de luz"},{"@type":"DefinedTerm","name":"Gente","description":"Pessoas, “nós” e também uma interjeição: “Gente!”"},{"@type":"DefinedTerm","name":"Grana","description":"Dinheiro"},{"@type":"DefinedTerm","name":"Jeitinho","description":"Dar um jeito de contornar uma regra, de forma amigável ou não"},{"@type":"DefinedTerm","name":"Legal","description":"Bacana, bom"},{"@type":"DefinedTerm","name":"Mano","description":"Irmão, parceiro. Marca do jeito paulistano"},{"@type":"DefinedTerm","name":"Massa","description":"Ótimo, muito legal"},{"@type":"DefinedTerm","name":"Meu","description":"Vocativo paulistano: “meu, olha isso”"},{"@type":"DefinedTerm","name":"Moleza","description":"Coisa fácil"},{"@type":"DefinedTerm","name":"Nossa","description":"De “Nossa Senhora”: expressão de espanto"},{"@type":"DefinedTerm","name":"Oxente","description":"Interjeição de surpresa no Nordeste"},{"@type":"DefinedTerm","name":"Oxi","description":"A versão abreviada de “oxente”: surpresa ou estranhamento"},{"@type":"DefinedTerm","name":"Pão-duro","description":"Pessoa que não gosta de gastar"},{"@type":"DefinedTerm","name":"Parça","description":"Parceiro, amigo de confiança"},{"@type":"DefinedTerm","name":"Partiu","description":"“Vamos!”"},{"@type":"DefinedTerm","name":"Pelada","description":"Futebol informal entre amigos"},{"@type":"DefinedTerm","name":"Pô","description":"Interjeição típica de quem fala no Rio, um “puxa” abreviado"},{"@type":"DefinedTerm","name":"Puxar o saco","description":"Bajular"},{"@type":"DefinedTerm","name":"Quebrar o galho","description":"Ajudar a resolver, temporariamente"},{"@type":"DefinedTerm","name":"Rolê","description":"Passeio, saída"},{"@type":"DefinedTerm","name":"Saudade","description":"Falta de algo ou de alguém. Palavra de orgulho nacional"},{"@type":"DefinedTerm","name":"Show de bola","description":"Excelente"},{"@type":"DefinedTerm","name":"Sextou","description":"Comemoração da sexta-feira"},{"@type":"DefinedTerm","name":"Sinistro","description":"Algo incrível ou algo perigoso. Depende do tom"},{"@type":"DefinedTerm","name":"Tá ligado?","description":"“Entendeu?” no fim da frase"},{"@type":"DefinedTerm","name":"Tamo junto","description":"“Estamos juntos”: solidariedade, ou um jeito de se despedir"},{"@type":"DefinedTerm","name":"Tchê","description":"Vocativo gaúcho"},{"@type":"DefinedTerm","name":"Tipo","description":"Muleta verbal: “tipo assim…”"},{"@type":"DefinedTerm","name":"Trem","description":"Em Minas, é qualquer coisa: “passa esse trem aí”"},{"@type":"DefinedTerm","name":"Tranquilo","description":"Sem problemas"},{"@type":"DefinedTerm","name":"Uai","description":"A interjeição mineira, de surpresa ou dúvida"},{"@type":"DefinedTerm","name":"Valeu","description":"“Obrigado” informal, ou “tchau”"},{"@type":"DefinedTerm","name":"Véi","description":"De “velho”: jeito informal de chamar um amigo, mesmo que jovem"},{"@type":"DefinedTerm","name":"Vixe","description":"Espanto. De “Virgem Maria”"},{"@type":"DefinedTerm","name":"Zoar","description":"Fazer brincadeira ou tirar sarro"}]}]}</script>
