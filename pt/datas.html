<script type="application/ld+json" id="ld-content">{"@context":"https://schema.org","@graph":[{"@type":"ItemList","name":"Datas importantes","url":"https://brazilianculture.biblioverse.org/pt/datas.html","numberOfItems":17,"itemListElement":[{"@type":"ListItem","position":1,"item":{"@type":"Thing","name":"Ano-Novo e Réveillon","description":"(Feriados · 1º de janeiro) Todos de branco na praia, sete ondas puladas, lentilha e fogos em Copacabana. Muitas pessoas levam flores para Iemanjá."}},{"@type":"ListItem","position":2,"item":{"@type":"Thing","name":"Dia de Iemanjá","description":"(Tradições · 2 de fevereiro) Em Salvador, milhares levam presentes ao mar no Rio Vermelho, em honra da rainha das águas do candomblé."}},{"@type":"ListItem","position":3,"item":{"@type":"Thing","name":"Carnaval","description":"(Festas · Fevereiro ou março) O maior feriado (não oficial) do ano. O país para para os desfiles, os blocos de rua e os trios. Sério de verdade, só depois de Quarta-Feira de Cinzas. Outro olhar: Nascido nas comunidades negras do Rio, o samba foi reprimido pela polícia nas primeiras décadas do século 20, antes de virar símbolo nacional."}},{"@type":"ListItem","position":4,"item":{"@type":"Thing","name":"Dia dos Povos Indígenas","description":"(Tradições · 19 de abril) Antes “Dia do Índio”, foi renomeado em 2022 por um termo mais respeitoso. Escolas ensinam, e muitas ainda pintam o rosto das crianças. Outro olhar: Lideranças indígenas costumam rejeitar a fantasia nas escolas e usar a data para o Acampamento Terra Livre, em Brasília, por demarcação de terras."}},{"@type":"ListItem","position":5,"item":{"@type":"Thing","name":"Sexta-Feira Santa e Páscoa","description":"(Feriados · Março ou abril) Bacalhau na sexta e ovos de chocolate gigantes pendurados nos supermercados."}},{"@type":"ListItem","position":6,"item":{"@type":"Thing","name":"Tiradentes","description":"(Feriados · 21 de abril) Lembra o enforcamento, em 1792, de Joaquim José da Silva Xavier, líder da Inconfidência Mineira. Quase um mártir nacional, retratado com barba e longos cabelos."}},{"@type":"ListItem","position":7,"item":{"@type":"Thing","name":"Descobrimento do Brasil","description":"(Tradições · 22 de abril) Data da chegada da frota de Cabral, em 1500. Não é feriado e passa quase sem festa. Outro olhar: Para os povos indígenas, não houve “descobrimento”, mas invasão. Na festa dos 500 anos, em 2000, a marcha indígena foi reprimida pela polícia em Porto Seguro."}},{"@type":"ListItem","position":8,"item":{"@type":"Thing","name":"Dia do Trabalho","description":"(Feriados · 1º de maio) Dia de atos sindicais e shows grátis, e também de anúncios do salário mínimo."}},{"@type":"ListItem","position":9,"item":{"@type":"Thing","name":"Abolição da Escravatura","description":"(Tradições · 13 de maio) Em 1888, a princesa Isabel assinou a Lei Áurea. Não é feriado nacional. Outro olhar: O movimento negro lembra que a lei não trouxe nenhuma terra, escola ou indenização, e prefere celebrar o 20 de novembro."}},{"@type":"ListItem","position":10,"item":{"@type":"Thing","name":"Festas Juninas","description":"(Festas · Junho) Quadrilha, fogueira, milho, pamonha e quentão, para Santo Antônio, São João e São Pedro. Em Campina Grande e Caruaru, é tão grande quanto o Carnaval."}},{"@type":"ListItem","position":11,"item":{"@type":"Thing","name":"Independência do Brasil","description":"(Feriados · 7 de setembro) Em 1822, às margens do Ipiranga, dom Pedro I disse “Independência ou morte!”. Hoje há desfile militar e, em anos recentes, manifestações políticas."}},{"@type":"ListItem","position":12,"item":{"@type":"Thing","name":"Nossa Senhora Aparecida e Dia das Crianças","description":"(Feriados · 12 de outubro) Dia da padroeira, com milhões de romeiros em Aparecida (SP). A mesma data é dia de brinquedos para as crianças."}},{"@type":"ListItem","position":13,"item":{"@type":"Thing","name":"Círio de Nazaré","description":"(Festas · 2º domingo de outubro) Em Belém, mais de 2 milhões de pessoas acompanham a imagem de Nossa Senhora, puxando uma corda enorme. Tem até almoço como o de Natal."}},{"@type":"ListItem","position":14,"item":{"@type":"Thing","name":"Finados","description":"(Feriados · 2 de novembro) Dia de levar flores aos cemitérios e lembrar quem se foi."}},{"@type":"ListItem","position":15,"item":{"@type":"Thing","name":"Proclamação da República","description":"(Feriados · 15 de novembro) Em 1889, o marechal Deodoro derrubou a monarquia em um golpe militar. A população, dizem os relatos, assistiu “bestializada”."}},{"@type":"ListItem","position":16,"item":{"@type":"Thing","name":"Dia da Consciência Negra","description":"(Feriados · 20 de novembro) Feriado nacional desde 2024, no aniversário da morte de Zumbi dos Palmares, em 1695. Celebra a luta e a cultura afro-brasileira. Outro olhar: Para o movimento negro, foi uma conquista: nasceu em 1971, no Rio Grande do Sul, com o grupo Palmares, como alternativa ao 13 de maio."}},{"@type":"ListItem","position":17,"item":{"@type":"Thing","name":"Natal","description":"(Feriados · 25 de dezembro) A ceia é na noite do dia 24, com peru, rabanada e frutas secas, em pleno verão. Amigo-secreto de família é obrigatório."}}]}]}</script>
