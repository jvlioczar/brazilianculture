<script type="application/ld+json" id="ld-content">{"@context":"https://schema.org","@graph":[{"@type":"ItemList","name":"Curiosidades","url":"https://brazilianculture.biblioverse.org/pt/curiosidades.html","numberOfItems":21,"itemListElement":[{"@type":"ListItem","position":1,"item":{"@type":"Thing","name":"O nome vem de uma árvore","description":"Brasil vem do pau-brasil, árvore de madeira avermelhada e primeira riqueza explorada. Antes, os tupis chamavam a terra de Pindorama, “terra das palmeiras”."}},{"@type":"ListItem","position":2,"item":{"@type":"Thing","name":"A bandeira é um céu","description":"O círculo azul mostra o céu do Rio na manhã de 15 de novembro de 1889, visto como de fora do globo. Cada estrela representa um estado. O verde e o amarelo vêm da família imperial, não da mata e do ouro."}},{"@type":"ListItem","position":3,"item":{"@type":"Thing","name":"Único no continente","description":"O Brasil é o único país de língua portuguesa da América, com fronteira com quase todos os vizinhos, menos Chile e Equador."}},{"@type":"ListItem","position":4,"item":{"@type":"Thing","name":"Um hino difícil","description":"O hino nacional tem duas partes com palavras como “lábaro” e “impávido colosso”. Quase ninguém sabe a letra completa, mas, à capela nos estádios, arrepia."}},{"@type":"ListItem","position":5,"item":{"@type":"Thing","name":"A capital planejada","description":"Brasília foi construída em 41 meses e, vista do alto, lembra um avião. Antes dela, as capitais foram Salvador e Rio."}},{"@type":"ListItem","position":6,"item":{"@type":"Thing","name":"Foi capital de Portugal","description":"O Rio foi a sede do Império Português de 1808 a 1821, depois de a corte fugir de Napoleão. É o único caso em que uma colônia virou centro de um império europeu."}},{"@type":"ListItem","position":7,"item":{"@type":"Thing","name":"Mais de mil línguas antes","description":"Calcula-se que havia mais de mil línguas indígenas em 1500. Sobraram 295, segundo o Censo 2022, e o nheengatu segue oficial em São Gabriel da Cachoeira (AM)."}},{"@type":"ListItem","position":8,"item":{"@type":"Thing","name":"Tupi em todo lugar","description":"Abacaxi, jacaré, Ipanema, Itaú, Curitiba, pipoca, carioca, Morumbi: milhares de palavras do português brasileiro têm origem indígena. Moqueca, samba, cafuné e bunda vêm de línguas africanas."}},{"@type":"ListItem","position":9,"item":{"@type":"Thing","name":"Natal de chinelo","description":"O hemisfério é sul, então o Natal é em pleno verão: Papai Noel de casaco sob 35 graus e ceia à meia-noite do dia 24."}},{"@type":"ListItem","position":10,"item":{"@type":"Thing","name":"Beijinho, quantos?","description":"Um em São Paulo, dois no Rio, três em Minas, e até nenhum. Não há regra nacional, e alguém sempre fica no ar."}},{"@type":"ListItem","position":11,"item":{"@type":"Thing","name":"Banho é sagrado","description":"Os brasileiros estão entre os povos que mais tomam banho no mundo, herança indígena muitas vezes citada. Muitos tomam mais de um por dia."}},{"@type":"ListItem","position":12,"item":{"@type":"Thing","name":"A hora é um conceito","description":"Festa marcada para as oito começa às dez, e chegar às oito é constrangedor. Reuniões de trabalho, porém, costumam ser mais pontuais."}},{"@type":"ListItem","position":13,"item":{"@type":"Thing","name":"Nome e apelido","description":"Pelé, Ronaldinho, Xuxa, Lula: os brasileiros tratam até presidentes pelo apelido. Lula, inclusive, incorporou o apelido ao nome legal."}},{"@type":"ListItem","position":14,"item":{"@type":"Thing","name":"Saudade tem dia","description":"O Dia da Saudade é 30 de janeiro. E, sim, muitos brasileiros dizem que a palavra não existe em outro idioma, embora ela exista em português de Portugal também."}},{"@type":"ListItem","position":15,"item":{"@type":"Thing","name":"Voto obrigatório","description":"Votar é obrigatório dos 18 aos 70 anos, e facultativo a partir dos 16. A apuração sai na mesma noite, e o país acompanha ao vivo."}},{"@type":"ListItem","position":16,"item":{"@type":"Thing","name":"Tem neve","description":"Neve é raríssima, mas acontece em cidades serranas do Sul, como São Joaquim (SC). A cidade vira notícia nacional e atrai turistas."}},{"@type":"ListItem","position":17,"item":{"@type":"Thing","name":"Jogo do bicho","description":"Criado em 1892 no Zoológico de Vila Isabel para atrair visitantes, é uma loteria ilegal há décadas e segue por todo lado, com grande influência nas escolas de samba."}},{"@type":"ListItem","position":18,"item":{"@type":"Thing","name":"Pix até na areia","description":"Pipoqueiro com carrinho, vendedor de mate na praia, biscoito Globo: a economia informal é parte da paisagem, e o pagamento hoje é por Pix."}},{"@type":"ListItem","position":19,"item":{"@type":"Thing","name":"Carnaval por todo lado","description":"O Carnaval não é uma festa só: Rio tem desfile e blocos, Salvador tem trios, Recife e Olinda têm frevo e bonecos gigantes. Cada um jura que o seu é o melhor."}},{"@type":"ListItem","position":20,"item":{"@type":"Thing","name":"Religião misturada","description":"É o maior país católico do mundo, tem grande população evangélica, e muitos frequentam terreiros de candomblé e umbanda. Jogar flores para Iemanjá no Réveillon é coisa de muitos, de muitas crenças."}},{"@type":"ListItem","position":21,"item":{"@type":"Thing","name":"A letra K no Brasil","description":"A risada escrita no Brasil é “kkkkk” e, em conversa, até “rsrs”. Um “kk” curto parece frio, e por isso muita gente enche a tela."}}]}]}</script>
