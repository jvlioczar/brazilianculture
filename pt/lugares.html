<script type="application/ld+json" id="ld-content">{"@context":"https://schema.org","@graph":[{"@type":"ItemList","name":"Lugares","url":"https://brazilianculture.biblioverse.org/pt/lugares.html","numberOfItems":32,"itemListElement":[{"@type":"ListItem","position":1,"item":{"@type":"TouristAttraction","name":"Copacabana","description":"A “princesinha do mar”, com calçadão de ondas, e a maior festa de Réveillon do país. Madonna e Lady Gaga reuniram mais de 1 e 2 milhões de pessoas em shows gratuitos."}},{"@type":"ListItem","position":2,"item":{"@type":"TouristAttraction","name":"Ipanema","description":"A da garota da música. Tem o pôr do sol aplaudido no Arpoador, os postos e o verão inteiro cantado na bossa nova."}},{"@type":"ListItem","position":3,"item":{"@type":"TouristAttraction","name":"Baía do Sancho","description":"Em Fernando de Noronha, com escada na fenda das pedras. Eleita várias vezes a melhor praia do mundo por viajantes."}},{"@type":"ListItem","position":4,"item":{"@type":"TouristAttraction","name":"Jericoacoara","description":"Vila de ruas de areia, dunas e pôr do sol na Duna. Tem a Pedra Furada e é santuário do kitesurf."}},{"@type":"ListItem","position":5,"item":{"@type":"TouristAttraction","name":"Porto de Galinhas","description":"Piscinas naturais de água morna entre recifes, que se visita de jangada. Um dos destinos mais famosos do Nordeste."}},{"@type":"ListItem","position":6,"item":{"@type":"TouristAttraction","name":"Praia do Rosa","description":"Enseada entre morros onde as baleias-francas chegam no inverno e os surfistas o ano inteiro."}},{"@type":"ListItem","position":7,"item":{"@type":"TouristAttraction","name":"Parque Nacional do Iguaçu","description":"Cataratas com cerca de 275 quedas, na fronteira com a Argentina. Patrimônio da Humanidade, com a Garganta do Diabo."}},{"@type":"ListItem","position":8,"item":{"@type":"TouristAttraction","name":"Lençóis Maranhenses","description":"Dunas brancas com lagoas azuis e verdes, cheias entre maio e setembro. Parece miragem."}},{"@type":"ListItem","position":9,"item":{"@type":"TouristAttraction","name":"Chapada Diamantina","description":"Cachoeira da Fumaça, Vale do Pati e o Poço Azul, em trilhas e cidadezinhas dos tempos do garimpo."}},{"@type":"ListItem","position":10,"item":{"@type":"TouristAttraction","name":"Pantanal","description":"A maior planície alagável do mundo, onde é mais fácil ver onça-pintada no planeta. Ameaçado por incêndios recentes."}},{"@type":"ListItem","position":11,"item":{"@type":"TouristAttraction","name":"Encontro das Águas","description":"Em Manaus, o rio Negro e o Solimões correm lado a lado por quilômetros sem se misturar."}},{"@type":"ListItem","position":12,"item":{"@type":"TouristAttraction","name":"Serra da Capivara","description":"Parque com milhares de pinturas rupestres, um dos maiores sítios do mundo, defendido pela arqueóloga Niède Guidon."}},{"@type":"ListItem","position":13,"item":{"@type":"TouristAttraction","name":"Amazônia","description":"A maior floresta tropical do planeta. Alter do Chão, as reservas e os rios são pontos de entrada para visitantes."}},{"@type":"ListItem","position":14,"item":{"@type":"TouristAttraction","name":"Cristo Redentor","description":"De braços abertos sobre a Guanabara desde 1931, a 710 m de altitude no Corcovado. Uma das Novas Sete Maravilhas do Mundo."}},{"@type":"ListItem","position":15,"item":{"@type":"TouristAttraction","name":"Pão de Açúcar","description":"O bondinho, de 1912, foi um dos primeiros teleféricos do mundo e já apareceu num filme de James Bond."}},{"@type":"ListItem","position":16,"item":{"@type":"TouristAttraction","name":"Pelourinho","description":"Casarões coloridos e igrejas barrocas, no local onde escravizados eram castigados. Michael Jackson gravou aqui com o Olodum."}},{"@type":"ListItem","position":17,"item":{"@type":"TouristAttraction","name":"Ouro Preto","description":"A cidade do ciclo do ouro e do barroco de Aleijadinho, com ladeiras e igrejas. Primeiro lugar brasileiro tombado pela Unesco."}},{"@type":"ListItem","position":18,"item":{"@type":"TouristAttraction","name":"Basílica de Aparecida","description":"Santuário da padroeira e um dos maiores templos católicos do mundo. Recebe milhões de romeiros a cada ano."}},{"@type":"ListItem","position":19,"item":{"@type":"TouristAttraction","name":"Congresso Nacional","description":"Duas torres, uma cúpula côncava e uma convexa: o símbolo da arquitetura de Niemeyer e do poder."}},{"@type":"ListItem","position":20,"item":{"@type":"TouristAttraction","name":"Teatro Amazonas","description":"Ópera de 1896, construída com o dinheiro da borracha em Manaus, com material vindo da Europa."}},{"@type":"ListItem","position":21,"item":{"@type":"TouristAttraction","name":"MASP","description":"O prédio suspenso de Lina Bo Bardi na Avenida Paulista, com o maior vão livre do tipo em sua época e o mais importante acervo da América do Sul."}},{"@type":"ListItem","position":22,"item":{"@type":"TouristAttraction","name":"Museu do Amanhã","description":"De Santiago Calatrava, na zona portuária do Rio, repaginada para os Jogos de 2016."}},{"@type":"ListItem","position":23,"item":{"@type":"TouristAttraction","name":"Instituto Inhotim","description":"Um parque botânico com arte contemporânea ao ar livre, entre os maiores do mundo no gênero, perto de Belo Horizonte."}},{"@type":"ListItem","position":24,"item":{"@type":"TouristAttraction","name":"Maracanã","description":"Palco de duas finais de Copa, da Olimpíada de 2016 e dos clássicos cariocas. É um verdadeiro templo do futebol."}},{"@type":"ListItem","position":25,"item":{"@type":"TouristAttraction","name":"Sambódromo","description":"A Marquês de Sapucaí, com projeto de Niemeyer, é onde as escolas desfilam."}},{"@type":"ListItem","position":26,"item":{"@type":"TouristAttraction","name":"Ponte Rio-Niterói","description":"Com mais de 13 km, aberta em 1974, cruza a Baía de Guanabara. Tem um dos maiores vãos do mundo em viga reta."}},{"@type":"ListItem","position":27,"item":{"@type":"TouristAttraction","name":"Ponte JK","description":"Três arcos que parecem pular sobre o Lago Paranoá, em Brasília. Ganhou o prêmio de melhor ponte do mundo em 2003."}},{"@type":"ListItem","position":28,"item":{"@type":"TouristAttraction","name":"Ponte Estaiada","description":"A ponte em forma de X sobre o rio Pinheiros, cartão-postal da São Paulo dos negócios."}},{"@type":"ListItem","position":29,"item":{"@type":"TouristAttraction","name":"Escadaria Selarón","description":"Azulejos de mais de 60 países, colados por um artista chileno que dedicou décadas à escada na Lapa."}},{"@type":"ListItem","position":30,"item":{"@type":"TouristAttraction","name":"Estátuas da Liberdade da Havan","description":"Em frente a muitas lojas da rede Havan, há uma réplica gigante da Estátua da Liberdade. Viraram parte da paisagem de beira de estrada."}},{"@type":"ListItem","position":31,"item":{"@type":"TouristAttraction","name":"Cristo Protetor","description":"Em Encantado, um Cristo novo, de 43,5 m, que supera em altura o do Rio."}},{"@type":"ListItem","position":32,"item":{"@type":"TouristAttraction","name":"Caixa-d’água de Varginha","description":"A cidade dos ETs tem uma caixa-d’água em forma de nave espacial, com alienígena e tudo."}}]}]}</script>
