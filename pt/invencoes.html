<script type="application/ld+json" id="ld-content">{"@context":"https://schema.org","@graph":[{"@type":"ItemList","name":"Invenções e ciência","url":"https://brazilianculture.biblioverse.org/pt/invencoes.html","numberOfItems":23,"itemListElement":[{"@type":"ListItem","position":1,"item":{"@type":"Thing","name":"Rede de dormir","description":"(Povos indígenas · séculos) Os europeus viram as redes logo na chegada, e Pero Vaz de Caminha as menciona. Hoje é item nacional, do Norte ao Nordeste."}},{"@type":"ListItem","position":2,"item":{"@type":"Thing","name":"Farinha de mandioca","description":"(Povos indígenas · milênios) Os indígenas domesticaram a mandioca e desenvolveram métodos para eliminar o veneno das variedades bravas, técnica levada depois para a África."}},{"@type":"ListItem","position":3,"item":{"@type":"Thing","name":"Terra preta","description":"(Povos indígenas · milênios) Solo escuro fértil criado por povos amazônicos que hoje intriga cientistas. A floresta também é, em parte, uma criação humana."}},{"@type":"ListItem","position":4,"item":{"@type":"Thing","name":"Passarola","description":"(Invenções · 1709) O padre Bartolomeu de Gusmão, nascido em Santos, fez um pequeno balão de ar quente voar diante da corte portuguesa."}},{"@type":"ListItem","position":5,"item":{"@type":"Thing","name":"Máquina de escrever","description":"(Invenções · 1861) O padre paraibano Francisco João de Azevedo mostrou uma máquina de datilografar antes dos modelos comerciais americanos."}},{"@type":"ListItem","position":6,"item":{"@type":"Thing","name":"Rádio de voz","description":"(Invenções · 1900) O padre gaúcho Roberto Landell de Moura fez transmissões de voz sem fio e registrou patente no Brasil e nos EUA."}},{"@type":"ListItem","position":7,"item":{"@type":"Thing","name":"Soro antiofídico","description":"(Ciência · 1901) Vital Brazil descobriu que cada tipo de cobra exige um soro específico e fundou o Instituto Butantan, um dos maiores centros de vacinas do mundo."}},{"@type":"ListItem","position":8,"item":{"@type":"Thing","name":"Saneamento e campanhas contra epidemias","description":"(Ciência · 1903) Oswaldo Cruz acabou com a febre amarela no Rio, mas a vacinação obrigatória contra varíola gerou a Revolta da Vacina, em 1904."}},{"@type":"ListItem","position":9,"item":{"@type":"Thing","name":"14-Bis","description":"(Invenções · 1906) Alberto Santos-Dumont voou em Paris na primeira decolagem pública de um avião sem catapulta. Para os brasileiros, ele, não os irmãos Wright, é o pai da aviação. Também popularizou o relógio de pulso."}},{"@type":"ListItem","position":10,"item":{"@type":"Thing","name":"Doença de Chagas","description":"(Ciência · 1909) Carlos Chagas descreveu sozinho o parasita, o vetor e a doença, um feito único na história da medicina."}},{"@type":"ListItem","position":11,"item":{"@type":"Thing","name":"Méson pi","description":"(Ciência · 1947) César Lattes participou da detecção dessa partícula subatômica. O Nobel foi só para o chefe, Cecil Powell. A plataforma nacional de currículos leva o nome dele."}},{"@type":"ListItem","position":12,"item":{"@type":"Thing","name":"Bradicinina","description":"(Ciência · 1948) Maurício Rocha e Silva a descobriu no veneno de jararaca. Pesquisas seguintes levaram ao captopril, um dos remédios mais usados contra hipertensão."}},{"@type":"ListItem","position":13,"item":{"@type":"Thing","name":"Formação Econômica do Brasil","description":"(Ciência · 1959) Celso Furtado explicou o subdesenvolvimento brasileiro em um clássico da economia mundial e criou a Sudene."}},{"@type":"ListItem","position":14,"item":{"@type":"Thing","name":"Fixação biológica do nitrogênio","description":"(Ciência · 1960) Johanna Döbereiner mostrou que bactérias podem substituir adubo na soja. Isso economiza bilhões por ano e sustenta boa parte da força do agro brasileiro."}},{"@type":"ListItem","position":15,"item":{"@type":"Thing","name":"Orelhão","description":"(Invenções · 1971) Criação da arquiteta Chu Ming Silveira. Barato, resistente e fácil de identificar, virou paisagem e foi exportado para outros países."}},{"@type":"ListItem","position":16,"item":{"@type":"Thing","name":"Stereobelt (o avô do walkman)","description":"(Invenções · 1972) O teuto-brasileiro Andreas Pavel criou em São Paulo um toca-fitas portátil de bolso. Anos depois, a Sony fez acordo pela patente."}},{"@type":"ListItem","position":17,"item":{"@type":"Thing","name":"Etanol e Proálcool","description":"(Invenções · 1975) Depois da crise do petróleo, o Brasil apostou no álcool de cana como combustível. A aposta levou ao carro flex (2003), hoje a maioria da frota brasileira."}},{"@type":"ListItem","position":18,"item":{"@type":"Thing","name":"Agricultura no Cerrado","description":"(Ciência · 1973) A Embrapa adaptou solo ácido e culturas ao Cerrado, transformando o Brasil em potência agrícola, com altos custos ambientais."}},{"@type":"ListItem","position":19,"item":{"@type":"Thing","name":"Geografia da Amazônia","description":"(Ciência · 1990) Bertha Becker mostrou que a floresta é também urbana e política, e influenciou planos de desenvolvimento sustentável da região."}},{"@type":"ListItem","position":20,"item":{"@type":"Thing","name":"Urna eletrônica","description":"(Invenções · 1996) Eleições gerais 100% eletrônicas desde 2000, com resultado apurado em poucas horas, mesmo com um eleitorado de 158 milhões."}},{"@type":"ListItem","position":21,"item":{"@type":"Thing","name":"Medalha Fields","description":"(Ciência · 2014) Artur Avila, carioca formado no IMPA, ganhou o “Nobel da matemática”, o primeiro para a América Latina."}},{"@type":"ListItem","position":22,"item":{"@type":"Thing","name":"Pix","description":"(Invenções · 2020) Sistema gratuito de pagamento instantâneo do Banco Central. Virou um caso de estudo no mundo: hoje até o pipoqueiro aceita."}},{"@type":"ListItem","position":23,"item":{"@type":"Thing","name":"Genoma do coronavírus","description":"(Ciência · 2020) Jaqueline Goes de Jesus e Ester Sabino sequenciaram o vírus 48 horas depois do primeiro caso no país."}}]}]}</script>
