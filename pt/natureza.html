<script type="application/ld+json" id="ld-content">{"@context":"https://schema.org","@graph":[{"@type":"ItemList","name":"Fauna e flora","url":"https://brazilianculture.biblioverse.org/pt/natureza.html","numberOfItems":32,"itemListElement":[{"@type":"ListItem","position":1,"item":{"@type":"Thing","name":"Onça-pintada","description":"(Mamíferos · Panthera onca) O maior felino das Américas e o símbolo da Amazônia e do Pantanal, onde turistas viajam para vê-la nadar."}},{"@type":"ListItem","position":2,"item":{"@type":"Thing","name":"Capivara","description":"(Mamíferos · Hydrochoerus hydrochaeris) O maior roedor do mundo, que passa tranquilo por lagos urbanos, praias e campos de golfe. Parece estar sempre em paz."}},{"@type":"ListItem","position":3,"item":{"@type":"Thing","name":"Lobo-guará","description":"(Mamíferos · Chrysocyon brachyurus) O maior canídeo da América do Sul, de pernas longas e pelo laranja. Come principalmente lobeira, a “fruta-do-lobo”, e estampa a nota de R$ 200."}},{"@type":"ListItem","position":4,"item":{"@type":"Thing","name":"Mico-leão-dourado","description":"(Mamíferos · Leontopithecus rosalia) Endêmico da Mata Atlântica do Rio. Quase foi extinto nos anos 70; um dos casos mais bem-sucedidos de conservação no mundo, e está na nota de R$ 20."}},{"@type":"ListItem","position":5,"item":{"@type":"Thing","name":"Tamanduá-bandeira","description":"(Mamíferos · Myrmecophaga tridactyla) Sem dentes, com língua de até 60 cm, come milhares de formigas e cupins por dia."}},{"@type":"ListItem","position":6,"item":{"@type":"Thing","name":"Boto-cor-de-rosa","description":"(Mamíferos · Inia geoffrensis) O golfinho de rio da Amazônia. Reza a lenda que vira um belo rapaz de chapéu e seduz as moças nas festas."}},{"@type":"ListItem","position":7,"item":{"@type":"Thing","name":"Preguiça","description":"(Mamíferos · Bradypus variegatus) Desce da árvore cerca de uma vez por semana, para fazer as necessidades. É vista nas árvores de praças de Salvador e do Rio."}},{"@type":"ListItem","position":8,"item":{"@type":"Thing","name":"Tatu-canastra","description":"(Mamíferos · Priodontes maximus) O maior tatu do mundo. Seu primo, o tatu-bola, foi mascote da Copa de 2014."}},{"@type":"ListItem","position":9,"item":{"@type":"Thing","name":"Peixe-boi","description":"(Mamíferos · Trichechus inunguis) Mamífero aquático da Amazônia e do litoral nordestino, ameaçado e protegido por projetos de conservação."}},{"@type":"ListItem","position":10,"item":{"@type":"Thing","name":"Baleia-jubarte","description":"(Mamíferos · Megaptera novaeangliae) Reproduz-se em Abrolhos, no sul da Bahia, entre julho e novembro. A população se recuperou após quase desaparecer."}},{"@type":"ListItem","position":11,"item":{"@type":"Thing","name":"Arara-azul","description":"(Aves · Anodorhynchus hyacinthinus) A maior arara do mundo, chega a um metro. Tem anel amarelo nos olhos e bico que quebra coquinhos. Seu reduto é o Pantanal."}},{"@type":"ListItem","position":12,"item":{"@type":"Thing","name":"Tucano-toco","description":"(Aves · Ramphastos toco) O bico enorme é leve e ajuda a resfriar o corpo. Tornou-se uma das imagens mais famosas do país, de cartões-postais a logos."}},{"@type":"ListItem","position":13,"item":{"@type":"Thing","name":"Ararinha-azul","description":"(Aves · Cyanopsitta spixii) A estrela do filme Rio. Extinta na natureza por anos, voltou à Caatinga da Bahia em 2022 por programa de reintrodução."}},{"@type":"ListItem","position":14,"item":{"@type":"Thing","name":"Uirapuru","description":"(Aves · Cyphorhinus arada) Pássaro amazônico de canto tão belo que, diz a lenda, a floresta se cala para ouvir."}},{"@type":"ListItem","position":15,"item":{"@type":"Thing","name":"Sabiá-laranjeira","description":"(Aves · Turdus rufiventris) A ave nacional. É a do verso “Minha terra tem palmeiras, onde canta o sabiá”, que está em todas as escolas."}},{"@type":"ListItem","position":16,"item":{"@type":"Thing","name":"Harpia","description":"(Aves · Harpia harpyja) Uma das maiores águias do mundo, caça macacos e preguiças."}},{"@type":"ListItem","position":17,"item":{"@type":"Thing","name":"Jacaré-do-pantanal","description":"(Répteis · Caiman yacare) Numa única lagoa do Pantanal, centenas podem ser vistos de perto."}},{"@type":"ListItem","position":18,"item":{"@type":"Thing","name":"Sucuri","description":"(Répteis · Eunectes murinus) Sem veneno, é a cobra mais pesada do mundo, e espera a presa na água para sufocá-la."}},{"@type":"ListItem","position":19,"item":{"@type":"Thing","name":"Jararaca","description":"(Répteis · Bothrops jararaca) Cobra da Mata Atlântica que causa mais acidentes no Sudeste. O veneno ajudou a criar remédios contra pressão alta."}},{"@type":"ListItem","position":20,"item":{"@type":"Thing","name":"Jararaca-ilhoa","description":"(Répteis · Bothrops insularis) Vive só na Ilha da Queimada Grande (SP), onde há cobras tão perigosas que o acesso é proibido."}},{"@type":"ListItem","position":21,"item":{"@type":"Thing","name":"Tartaruga-de-pente","description":"(Répteis · Eretmochelys imbricata) Protegida pelo Projeto Tamar desde 1980, que transformou comunidades que comiam ovos em aliadas das tartarugas."}},{"@type":"ListItem","position":22,"item":{"@type":"Thing","name":"Pirarucu","description":"(Peixes · Arapaima gigas) Um dos maiores peixes de água doce do mundo, chega a 3 metros. Respira ar, e é manejado de forma sustentável na Amazônia."}},{"@type":"ListItem","position":23,"item":{"@type":"Thing","name":"Piranha","description":"(Peixes · Pygocentrus nattereri) Muito menos perigosa do que nos filmes. Pescá-las é parte do roteiro turístico do Pantanal, e o caldo de piranha é famoso."}},{"@type":"ListItem","position":24,"item":{"@type":"Thing","name":"Ipê-amarelo","description":"(Plantas · Handroanthus spp.) A árvore nacional de fato, sobretudo por florescer sem folhas no inverno, colorindo cidades e estradas."}},{"@type":"ListItem","position":25,"item":{"@type":"Thing","name":"Pau-brasil","description":"(Plantas · Paubrasilia echinata) A árvore que deu nome ao país, quase extinta pelo comércio de tinta. Hoje protegida, a madeira é a dos arcos de violino mais famosos."}},{"@type":"ListItem","position":26,"item":{"@type":"Thing","name":"Araucária","description":"(Plantas · Araucaria angustifolia) O “pinheiro-do-paraná”, árvore símbolo do Sul, com copa em forma de taça. A semente, o pinhão, é comida de festa junina."}},{"@type":"ListItem","position":27,"item":{"@type":"Thing","name":"Vitória-régia","description":"(Plantas · Victoria amazonica) A maior folha de planta aquática, flutua nos rios da Amazônia e suporta o peso de uma criança."}},{"@type":"ListItem","position":28,"item":{"@type":"Thing","name":"Castanheira-do-pará","description":"(Plantas · Bertholletia excelsa) Pode viver séculos e chegar a 50 m. Dela vem a “castanha-do-brasil”, e sua colheita mantém muitas comunidades da floresta."}},{"@type":"ListItem","position":29,"item":{"@type":"Thing","name":"Seringueira","description":"(Plantas · Hevea brasiliensis) Fez a riqueza de Manaus e o Teatro Amazonas durante o ciclo da borracha, antes de sementes levadas à Ásia acabarem com o monopólio."}},{"@type":"ListItem","position":30,"item":{"@type":"Thing","name":"Orquídea","description":"(Plantas · Cattleya labiata) A flor nacional. O Brasil tem milhares de espécies de orquídeas, sobretudo na Mata Atlântica."}},{"@type":"ListItem","position":31,"item":{"@type":"Thing","name":"Buriti","description":"(Plantas · Mauritia flexuosa) Palmeira das veredas do Cerrado, onde também vive o sertão de Guimarães Rosa. É fonte de óleo, doce e fibras."}},{"@type":"ListItem","position":32,"item":{"@type":"Thing","name":"Mandacaru","description":"(Plantas · Cereus jamacaru) Cacto da Caatinga, que, segundo a canção Xote das Meninas, ao florir na seca é sinal de que a chuva vem."}}]}]}</script>
