<script type="application/ld+json" id="ld-content">{"@context":"https://schema.org","@graph":[{"@type":"ItemList","name":"Wildlife and plants","url":"https://brazilianculture.biblioverse.org/wildlife-and-plants.html","numberOfItems":32,"itemListElement":[{"@type":"ListItem","position":1,"item":{"@type":"Thing","name":"Jaguar","description":"(Mammals · Panthera onca) The largest cat in the Americas and the symbol of the Amazon and Pantanal, where tourists travel to watch it swim."}},{"@type":"ListItem","position":2,"item":{"@type":"Thing","name":"Capybara","description":"(Mammals · Hydrochoerus hydrochaeris) The world’s largest rodent, wandering calmly through urban lakes, beaches and golf courses. It always seems at peace."}},{"@type":"ListItem","position":3,"item":{"@type":"Thing","name":"Maned wolf","description":"(Mammals · Chrysocyon brachyurus) South America’s largest canid, with long legs and orange fur. It mainly eats the lobeira, or “wolf apple”, and is on the R$200 note."}},{"@type":"ListItem","position":4,"item":{"@type":"Thing","name":"Golden lion tamarin","description":"(Mammals · Leontopithecus rosalia) Found only in Rio’s Atlantic Forest. It nearly went extinct in the 1970s and became one of the world’s most successful conservation stories. It’s on the R$20 note."}},{"@type":"ListItem","position":5,"item":{"@type":"Thing","name":"Giant anteater","description":"(Mammals · Myrmecophaga tridactyla) Toothless, with a tongue up to 60 cm long, it eats thousands of ants and termites a day."}},{"@type":"ListItem","position":6,"item":{"@type":"Thing","name":"Pink river dolphin","description":"(Mammals · Inia geoffrensis) The Amazon’s river dolphin. Legend says it turns into a handsome young man in a hat who seduces girls at parties."}},{"@type":"ListItem","position":7,"item":{"@type":"Thing","name":"Sloth","description":"(Mammals · Bradypus variegatus) It climbs down about once a week to go to the toilet. You can spot them in the trees of squares in Salvador and Rio."}},{"@type":"ListItem","position":8,"item":{"@type":"Thing","name":"Giant armadillo","description":"(Mammals · Priodontes maximus) The world’s largest armadillo. Its cousin, the three-banded armadillo, was the mascot of the 2014 World Cup."}},{"@type":"ListItem","position":9,"item":{"@type":"Thing","name":"Amazonian manatee","description":"(Mammals · Trichechus inunguis) An aquatic mammal of the Amazon, threatened and protected by conservation projects."}},{"@type":"ListItem","position":10,"item":{"@type":"Thing","name":"Humpback whale","description":"(Mammals · Megaptera novaeangliae) It breeds off Abrolhos, in southern Bahia, between July and November. The population recovered after almost disappearing."}},{"@type":"ListItem","position":11,"item":{"@type":"Thing","name":"Hyacinth macaw","description":"(Birds · Anodorhynchus hyacinthinus) The world’s largest macaw, up to a metre long, with yellow eye rings and a beak that cracks palm nuts. Its stronghold is the Pantanal, and it’s the bird on our cover."}},{"@type":"ListItem","position":12,"item":{"@type":"Thing","name":"Toco toucan","description":"(Birds · Ramphastos toco) Its huge beak is light and helps it cool down. One of the country’s most famous images, from postcards to logos."}},{"@type":"ListItem","position":13,"item":{"@type":"Thing","name":"Spix’s macaw","description":"(Birds · Cyanopsitta spixii) The star of the film Rio. Extinct in the wild for years, it returned to the Bahian Caatinga in 2022 through a reintroduction programme."}},{"@type":"ListItem","position":14,"item":{"@type":"Thing","name":"Musician wren","description":"(Birds · Cyphorhinus arada) The uirapuru, an Amazon bird whose song is so beautiful that, legend says, the forest falls silent to listen."}},{"@type":"ListItem","position":15,"item":{"@type":"Thing","name":"Rufous-bellied thrush","description":"(Birds · Turdus rufiventris) The national bird, the sabiá. It’s the one in the verse “My land has palm trees, where the sabiá sings”, known to every schoolchild."}},{"@type":"ListItem","position":16,"item":{"@type":"Thing","name":"Harpy eagle","description":"(Birds · Harpia harpyja) One of the world’s largest eagles, it hunts monkeys and sloths."}},{"@type":"ListItem","position":17,"item":{"@type":"Thing","name":"Yacare caiman","description":"(Reptiles · Caiman yacare) In a single Pantanal lagoon, hundreds can be seen up close."}},{"@type":"ListItem","position":18,"item":{"@type":"Thing","name":"Green anaconda","description":"(Reptiles · Eunectes murinus) Not venomous, it’s the world’s heaviest snake, and it waits in the water to suffocate its prey."}},{"@type":"ListItem","position":19,"item":{"@type":"Thing","name":"Jararaca","description":"(Reptiles · Bothrops jararaca) An Atlantic Forest snake behind many bites in the Southeast. Its venom helped create medicines for high blood pressure."}},{"@type":"ListItem","position":20,"item":{"@type":"Thing","name":"Golden lancehead","description":"(Reptiles · Bothrops insularis) It lives only on Queimada Grande Island, off São Paulo, where the snakes are so dangerous that access is banned."}},{"@type":"ListItem","position":21,"item":{"@type":"Thing","name":"Hawksbill turtle","description":"(Reptiles · Eretmochelys imbricata) Protected since 1980 by Projeto Tamar, which turned communities that ate the eggs into turtle allies."}},{"@type":"ListItem","position":22,"item":{"@type":"Thing","name":"Pirarucu","description":"(Fish · Arapaima gigas) One of the world’s largest freshwater fish, up to 3 metres long. It breathes air and is sustainably managed in the Amazon."}},{"@type":"ListItem","position":23,"item":{"@type":"Thing","name":"Piranha","description":"(Fish · Pygocentrus nattereri) Far less dangerous than in the movies. Fishing for them is on the Pantanal tourist trail and piranha soup is famous."}},{"@type":"ListItem","position":24,"item":{"@type":"Thing","name":"Yellow ipê","description":"(Plants · Handroanthus spp.) The country’s national tree in practice, flowering leafless in winter and colouring cities and highways."}},{"@type":"ListItem","position":25,"item":{"@type":"Thing","name":"Brazilwood","description":"(Plants · Paubrasilia echinata) The tree that named the country, almost wiped out by the dye trade. Now protected, its wood makes the finest violin bows."}},{"@type":"ListItem","position":26,"item":{"@type":"Thing","name":"Araucaria","description":"(Plants · Araucaria angustifolia) The Paraná pine, tree symbol of the South, with a cup-shaped crown. Its seed, the pinhão, is a June festival treat."}},{"@type":"ListItem","position":27,"item":{"@type":"Thing","name":"Giant water lily","description":"(Plants · Victoria amazonica) The largest aquatic plant leaf, floating on Amazon rivers and able to bear the weight of a child."}},{"@type":"ListItem","position":28,"item":{"@type":"Thing","name":"Brazil nut tree","description":"(Plants · Bertholletia excelsa) It can live for centuries and reach 50 m. The harvest of the nuts supports many forest communities."}},{"@type":"ListItem","position":29,"item":{"@type":"Thing","name":"Rubber tree","description":"(Plants · Hevea brasiliensis) It built Manaus and its opera house during the rubber boom, before seeds taken to Asia ended the monopoly."}},{"@type":"ListItem","position":30,"item":{"@type":"Thing","name":"Orchid","description":"(Plants · Cattleya labiata) The national flower. Brazil has thousands of orchid species, especially in the Atlantic Forest."}},{"@type":"ListItem","position":31,"item":{"@type":"Thing","name":"Buriti palm","description":"(Plants · Mauritia flexuosa) A palm of the Cerrado wetlands, the landscape of Guimarães Rosa’s backlands. A source of oil, sweets and fibre."}},{"@type":"ListItem","position":32,"item":{"@type":"Thing","name":"Mandacaru","description":"(Plants · Cereus jamacaru) A cactus of the Caatinga. According to the song Xote das Meninas, when it flowers in the drought, rain is coming."}}]}]}</script>
