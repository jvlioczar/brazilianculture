<script type="application/ld+json" id="ld-content">{"@context":"https://schema.org","@graph":[{"@type":"ItemList","name":"Places","url":"https://brazilianculture.biblioverse.org/places.html","numberOfItems":32,"itemListElement":[{"@type":"ListItem","position":1,"item":{"@type":"TouristAttraction","name":"Copacabana","description":"The “little princess of the sea”, with its wave pavement and the country’s biggest New Year’s party. Madonna and Lady Gaga drew over 1 and 2 million people to free shows here."}},{"@type":"ListItem","position":2,"item":{"@type":"TouristAttraction","name":"Ipanema","description":"The one from the song. It has the applauded sunset at Arpoador, numbered lifeguard posts and a summer sung in bossa nova."}},{"@type":"ListItem","position":3,"item":{"@type":"TouristAttraction","name":"Baía do Sancho","description":"On Fernando de Noronha, reached by a staircase through a crack in the rocks. Repeatedly voted the world’s best beach by travellers."}},{"@type":"ListItem","position":4,"item":{"@type":"TouristAttraction","name":"Jericoacoara","description":"A village with sand streets, dunes and sunset on the Big Dune. It has the Pedra Furada arch and is a kitesurfing paradise."}},{"@type":"ListItem","position":5,"item":{"@type":"TouristAttraction","name":"Porto de Galinhas","description":"Warm natural pools among the reefs, reached by raft. One of the Northeast’s most famous destinations."}},{"@type":"ListItem","position":6,"item":{"@type":"TouristAttraction","name":"Praia do Rosa","description":"A bay between hills where right whales arrive in winter and surfers all year long."}},{"@type":"ListItem","position":7,"item":{"@type":"TouristAttraction","name":"Iguaçu National Park","description":"Around 275 waterfalls on the border with Argentina. World Heritage, with the Devil’s Throat."}},{"@type":"ListItem","position":8,"item":{"@type":"TouristAttraction","name":"Lençóis Maranhenses","description":"White dunes with blue and green lagoons that fill between May and September. It looks like a mirage."}},{"@type":"ListItem","position":9,"item":{"@type":"TouristAttraction","name":"Chapada Diamantina","description":"Fumaça Falls, Vale do Pati and Poço Azul, with trails and little towns from the mining days."}},{"@type":"ListItem","position":10,"item":{"@type":"TouristAttraction","name":"Pantanal","description":"The world’s largest tropical wetland and the best place on the planet to see a jaguar. Threatened by recent fires."}},{"@type":"ListItem","position":11,"item":{"@type":"TouristAttraction","name":"Meeting of the Waters","description":"At Manaus, the Negro and Solimões rivers run side by side for kilometres without mixing."}},{"@type":"ListItem","position":12,"item":{"@type":"TouristAttraction","name":"Serra da Capivara","description":"A park with thousands of rock paintings, one of the world’s largest such sites, defended by archaeologist Niède Guidon."}},{"@type":"ListItem","position":13,"item":{"@type":"TouristAttraction","name":"The Amazon","description":"The largest tropical rainforest on the planet. Alter do Chão, the reserves and the rivers are entry points for visitors."}},{"@type":"ListItem","position":14,"item":{"@type":"TouristAttraction","name":"Christ the Redeemer","description":"Arms wide open over Guanabara Bay since 1931, at 710 m on Corcovado. One of the New Seven Wonders of the World."}},{"@type":"ListItem","position":15,"item":{"@type":"TouristAttraction","name":"Sugarloaf Mountain","description":"The cable car, from 1912, was one of the world’s first, and it has been in a James Bond film."}},{"@type":"ListItem","position":16,"item":{"@type":"TouristAttraction","name":"Pelourinho","description":"Colourful mansions and baroque churches on the site where enslaved people were punished. Michael Jackson filmed here with Olodum."}},{"@type":"ListItem","position":17,"item":{"@type":"TouristAttraction","name":"Ouro Preto","description":"The gold rush city of Aleijadinho’s baroque, with steep streets and churches. Brazil’s first UNESCO World Heritage site."}},{"@type":"ListItem","position":18,"item":{"@type":"TouristAttraction","name":"Basilica of Aparecida","description":"The shrine of the patron saint and one of the world’s largest Catholic temples. It receives millions of pilgrims a year."}},{"@type":"ListItem","position":19,"item":{"@type":"TouristAttraction","name":"National Congress","description":"Two towers, one concave dome and one convex: the symbol of Niemeyer’s architecture and of power."}},{"@type":"ListItem","position":20,"item":{"@type":"TouristAttraction","name":"Amazon Theatre","description":"An 1896 opera house built with rubber money in Manaus, using materials brought from Europe."}},{"@type":"ListItem","position":21,"item":{"@type":"TouristAttraction","name":"MASP","description":"Lina Bo Bardi’s suspended building on Avenida Paulista, with a record free span for its time and the most important art collection in South America."}},{"@type":"ListItem","position":22,"item":{"@type":"TouristAttraction","name":"Museum of Tomorrow","description":"By Santiago Calatrava, in Rio’s port zone, revamped for the 2016 Games."}},{"@type":"ListItem","position":23,"item":{"@type":"TouristAttraction","name":"Inhotim","description":"A botanical park with open-air contemporary art, among the largest of its kind in the world, near Belo Horizonte."}},{"@type":"ListItem","position":24,"item":{"@type":"TouristAttraction","name":"Maracanã","description":"Stage of two World Cup finals, the 2016 Olympics and Rio’s derbies. A true temple of football."}},{"@type":"ListItem","position":25,"item":{"@type":"TouristAttraction","name":"Sambadrome","description":"Marquês de Sapucaí, designed by Niemeyer, is where the samba schools parade."}},{"@type":"ListItem","position":26,"item":{"@type":"TouristAttraction","name":"Rio–Niterói Bridge","description":"Over 13 km long, opened in 1974, crossing Guanabara Bay. It has one of the world’s longest straight girder spans."}},{"@type":"ListItem","position":27,"item":{"@type":"TouristAttraction","name":"JK Bridge","description":"Three arches that seem to skip over Lake Paranoá in Brasília. It won the world’s best bridge prize in 2003."}},{"@type":"ListItem","position":28,"item":{"@type":"TouristAttraction","name":"Octávio Frias Bridge","description":"The X-shaped cable-stayed bridge over the Pinheiros River, a postcard of business São Paulo."}},{"@type":"ListItem","position":29,"item":{"@type":"TouristAttraction","name":"Selarón Steps","description":"Tiles from over 60 countries, stuck on by a Chilean artist who devoted decades to the stairway in Lapa."}},{"@type":"ListItem","position":30,"item":{"@type":"TouristAttraction","name":"Havan’s Statues of Liberty","description":"Outside many stores of the Havan chain stands a giant replica of the Statue of Liberty. They’ve become part of the roadside scenery."}},{"@type":"ListItem","position":31,"item":{"@type":"TouristAttraction","name":"Christ the Protector","description":"In Encantado, a new 43.5 m Christ taller than Rio’s."}},{"@type":"ListItem","position":32,"item":{"@type":"TouristAttraction","name":"The Varginha water tower","description":"The town of the aliens has a water tower shaped like a spaceship, ET and all."}}]}]}</script>
